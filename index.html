    ['Rear delts','Side delts','Machine delts'].forEach(function(n){
      state.groups.forEach(function(g){
        if(g===sh)return;
        for(var i=0;i<g.exercises.length;i++){
          if(g.exercises[i].name.toLowerCase()===n.toLowerCase()){
            sh.exercises.push(g.exercises.splice(i,1)[0]);
            return;
          }
        }
      });
    });
    state.version=3;changed=true;
  }
  // v4: game container
  if(!('game' in state)){state.game=null;changed=true;}
  if(state.game){
    if(!state.game.enc)state.game.enc={};
    if(!state.game.flags)state.game.flags={};
    if(!state.game.seen)state.game.seen={};
    if(!state.game.dex)state.game.dex={};
    if(!Array.isArray(state.game.mons))state.game.mons=[];
  }
  if(!(state.version>=4)){state.version=4;changed=true;}
  // v5: boss ladder + replay flag
  if(state.game&&!state.game.boss&&!state.game.flags.champion){state.game.boss={idx:0,hp:BOSSES[0].hp};changed=true;}
  if(state.game&&!state.gamePlayed){state.gamePlayed=1;changed=true;}
  if(!(state.version>=5)){state.version=5;changed=true;}
  // v6: sound + hero
  if(state.sound===undefined){state.sound=true;changed=true;}
  if(state.game&&state.game.player===undefined){state.game.player=null;changed=true;}
  if(!(state.version>=6)){state.version=6;changed=true;}
  // v7: rematch rounds
  if(state.game&&!state.game.round){state.game.round=1;changed=true;}
  if(state.game&&state.game.flags.champion&&!state.game.boss){
    state.game.round=2;state.game.boss={idx:0,hp:hpFor(0,2)};changed=true;
  }
  if(!(state.version>=7)){state.version=7;changed=true;}
  // v8: oak's egg slot
  if(state.game&&state.game.egg===undefined){state.game.egg=null;changed=true;}
  if(!(state.version>=8)){state.version=8;changed=true;}
  // v9: money, bag, hall of fame, manual party
  if(state.game){
    if(state.game.money===undefined){
      state.game.money=3000+badgeCount()*1500+(state.game.flags.champion?5000:0);
      changed=true;
    }
    if(!state.game.bag){state.game.bag={};changed=true;}
    if(!Array.isArray(state.game.hof)){state.game.hof=[];changed=true;}
    if(state.game.partyIds===undefined){state.game.partyIds=null;changed=true;}
    if(!state.game.medals){state.game.medals={};changed=true;}
    if(!state.game.hurt){state.game.hurt={};changed=true;}
    if(state.game.raid===undefined){state.game.raid=null;changed=true;}
    if(state.game.road===undefined){state.game.road=null;changed=true;}
    if(state.game.daily===undefined){state.game.daily=null;changed=true;}
    if(state.game.npcq===undefined){state.game.npcq=null;changed=true;}
    if(state.game.visit===undefined){state.game.visit=null;changed=true;}
    if(!state.game.beenTo){ // old saves have already been to every town up to their progress
      state.game.beenTo={};for(var _t=0;_t<=townIdx();_t++)state.game.beenTo[_t]=1;changed=true;
    }
    if(!state.game.rest){state.game.rest={};changed=true;}
    if(state.game.bag&&state.game.bag.xattack){
      state.game.bag.fullrestore=(state.game.bag.fullrestore||0)+state.game.bag.xattack;
      delete state.game.bag.xattack;changed=true;
    }
  }
  if(!(state.version>=9)){state.version=9;changed=true;}
  // v10: per-road quest history + battle catching (the passive catch bars retired)
  if(state.game){
    if(!state.game.roadLog){
      state.game.roadLog={};
      // roads already behind you were fully cleared to advance — record them as such
      var _endIdx=state.game.boss?Math.min(state.game.boss.idx,ROAD_LOC.length):ROAD_LOC.length;
      for(var _r=0;_r<_endIdx;_r++)state.game.roadLog[_r]={synth:1,round:1};
      changed=true;
    }
    if(state.game.enc&&Object.keys(state.game.enc).length){state.game.enc={};changed=true;}
    // every caught species counts as seen (fills the AREA DEX silhouettes)
    Object.keys(state.game.dex||{}).forEach(function(_sp){
      if(state.game.dex[_sp]&&state.game.dex[_sp].c&&!state.game.seen[_sp]){state.game.seen[_sp]=1;changed=true;}
    });
  }
  if(!(state.version>=10)){state.version=10;changed=true;}
  // v11: the special places open their doors
  if(state.game&&!state.game.poi){state.game.poi={};changed=true;}
  if(!(state.version>=11)){state.version=11;changed=true;}
  // v12: battle points + trainer-card streak record (Athlete's Pack)
  if(state.game){
    if(state.game.bp===undefined){state.game.bp=0;changed=true;}
    if(state.game.bestStreak===undefined){
      state.game.bestStreak=(state.game.daily&&state.game.daily.streak)||0;changed=true;
    }
  }
  if(!(state.version>=12)){state.version=12;changed=true;}
  // v13: two regions — the active game lives in state.game, the parked one in state.altGame
  if(state.region!=='kanto'&&state.region!=='hoenn'){state.region='kanto';changed=true;}
  if(!('altGame' in state)){state.altGame=null;changed=true;}
  if(state.game&&!state.game.region){state.game.region=state.region;changed=true;}
  if(state.altGame&&!state.altGame.region){state.altGame.region=(state.region==='kanto'?'hoenn':'kanto');changed=true;}
  // a mismatched pair (same region twice after a bad import) parks the duplicate as lost — never happened organically
  if(!(state.version>=13)){state.version=13;changed=true;}
  // v14: Magma & Aqua (v6.1) — story lives in flags.arc1..arc8, building steps in poi.*;
  // both are freeform containers that older saves already carry, so nothing to backfill
  if(!(state.version>=14)){state.version=14;changed=true;}
  // v15: the Battle Frontier (v6.2) — all state lives in poi.bf, freeform; nothing to backfill
  if(!(state.version>=15)){state.version=15;changed=true;}
  // v16: Secret Bases (v6.3) — game.base is new and optional; nothing to backfill
  if(!(state.version>=16)){state.version=16;changed=true;}
  // v17: Contest Spectacular (v6.4) — bodyweight log at the root (shared across regions);
  // contest/berry/shoal/nav state lives in poi.* and on mons (cond/rib), all freeform
  if(!Array.isArray(state.bw)){state.bw=[];changed=true;}
  if(!(state.version>=17)){state.version=17;changed=true;}
  // v18: v6.7 — FIELD RESEARCH counters, seeded from what each save already owns
  function seedRes(gm2){
    if(!gm2||gm2.res)return false;
    gm2.res={};
    var cnt={};
    (gm2.mons||[]).forEach(function(m){cnt[m.sp]=(cnt[m.sp]||0)+1;});
    Object.keys(gm2.dex||{}).forEach(function(sp2){
      if(gm2.dex[sp2]&&gm2.dex[sp2].c)cnt[sp2]=Math.max(cnt[sp2]||0,1);
    });
    Object.keys(cnt).forEach(function(sp2){gm2.res[sp2]={c:cnt[sp2]};});
    return true;
  }
  if(state.game&&seedRes(state.game))changed=true;
  if(state.altGame&&seedRes(state.altGame))changed=true;
  if(!(state.version>=18)){state.version=18;changed=true;}
  // v19: v6.8 TRAINER CARDS — level derives live from training days, picks bank
  // automatically, game.perks is created lazily; nothing to backfill
  if(!(state.version>=19)){state.version=19;changed=true;}
  // v20: v6.9 — the hero levels by TRAINER XP now; seed each save's bar from its
  // training days (1,200 XP per day ≈ one solid workout) so nobody starts over
  function seedTXp(gm2){
    if(!gm2)return false;
    if(!gm2.perks)gm2.perks={used:0,taken:{},offer:null,annLv:1};
    if(gm2.perks.xp!==undefined)return false;
    var m={};
    allLogsFlat().forEach(function(o){if(o.l.ts>=(gm2.startTs||0))m[dateKey(o.l.ts)]=1;});
    gm2.perks.xp=Object.keys(m).length*1200;
    return true;
  }
  if(state.game&&seedTXp(state.game))changed=true;
  if(state.altGame&&seedTXp(state.altGame))changed=true;
  if(!(state.version>=20)){state.version=20;changed=true;}
  // a workout left running for >6h was clearly forgotten: close it at the last logged set
  if(state.session&&Date.now()-state.session.start>6*3600000){
    var ses=state.session, limit=ses.start+6*3600000, lastTs=0;
    allLogsFlat().forEach(function(o){if(o.l.ts>=ses.start&&o.l.ts<=limit&&o.l.ts>lastTs)lastTs=o.l.ts;});
    if(lastTs>ses.start){
      var st=sessionStats(ses.start,lastTs);
      state.sessions.push({id:uid(),start:ses.start,end:lastTs,sets:st.sets,volume:st.volume,exercises:st.exercises});
      note='Your last workout was still running — saved it automatically.';
    }
    state.session=null;changed=true;
  }
  if(changed)save();
  return note;
}

function weeksChartHTML(){
  var daysSet={};
  allLogsFlat().forEach(function(o){daysSet[startOfDay(o.l.ts)]=1;});
  var thisWS=weekStartTs(Date.now()), weeks=[];
  for(var i=7;i>=0;i--){
    var ws=thisWS-i*7*DAY, n=0;
    Object.keys(daysSet).forEach(function(k){var t=+k;if(t>=ws&&t<ws+7*DAY)n++;});
    weeks.push({ws:ws,n:n});
  }
  var max=Math.max.apply(null,weeks.map(function(w){return w.n;}).concat([4]));
  var W=312,H=92,bw=28,gap=10.6,bars='';
  weeks.forEach(function(w,i){
    var x=i*(bw+gap), bh=Math.max(3,Math.round(w.n/max*56)), y=72-bh;
    var cur=i===weeks.length-1;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+(cur?'#E89028':'var(--accent)')+'" opacity="'+(w.n?1:.25)+'"/>';

  });
  var d0=new Date(weeks[0].ws);
  bars+='<text x="0" y="'+(H-2)+'" style="fill:#787878;font-size:13px;font-family:VT323">'+MONTHS[d0.getMonth()]+' '+d0.getDate()+'</text>'+
    '<text x="'+W+'" y="'+(H-2)+'" text-anchor="end" style="fill:#787878;font-size:13px;font-family:VT323">this week</text>';

function perkN(k){
  var g=state.game;

}

/* SECOND WIND: the fighter breathes back 3% max HP after any set (battle step) */
function perkWindStep(am){
  if(!perkN('secondwind')||!am)return null;
  var mx=maxHpOf(am),cur=Math.max(0,curHpOf(am));
  if(cur<=0||cur>=mx)return null;
  var heal=Math.max(1,Math.round(mx*0.03));
  var from=Math.round(cur/mx*100);
  state.session.phps[am.uid]=Math.min(mx,cur+heal);
  return {msg:DEX[am.sp].n+' caught a SECOND WIND!',sfx:'save',
    php:[from,Math.round(state.session.phps[am.uid]/mx*100)],hold:700};
}
/* v6.9: the hero levels like a POKEMON — TRAINER XP flows from every set
   (the same effort-scaled gain the fighter earns). Curve: level L→L+1 costs
   350+90·(L-1) XP, so early levels land mid-workout and it settles near one
   level per solid session. perks.xp is the only stored number. */
function tXpNeed(L){return 350+90*(L-1);}
function trainerLevel(){
  if(!state.game)return 1;
  var xp=(state.game.perks&&state.game.perks.xp)||0,L=1;
  while(L<999&&xp>=tXpNeed(L)){xp-=tXpNeed(L);L++;}
  return L;
}
function trainerLvProg(){
  var xp=(state.game.perks&&state.game.perks.xp)||0,L=1;
  while(L<999&&xp>=tXpNeed(L)){xp-=tXpNeed(L);L++;}
  return {have:Math.round(xp),need:tXpNeed(L)};
}
function perkAddXp(n){
  if(!state.game||!(n>0))return;
  var pk=perksOf();
  pk.xp=(pk.xp||0)+Math.round(n*(1+0.10*perkN('fastlearner')));
}
function perkPicksLeft(){
  if(!state.game)return 0;
  return Math.max(0,(trainerLevel()-1)-(perksOf().used||0));
}
function perkEligible(){
  return PERKS.filter(function(p){return perkN(p.k)<p.cap;});
}
/* roll the 3-card offer STATE-FIRST; stored until a pick is made */
function perkRollOffer(){
  var pool=perkEligible(),picks=[];
  while(picks.length<3&&pool.length){
    var tot=0;
    pool.forEach(function(p){tot+=PERK_RAR_W[p.r];});
    var roll=Math.random()*tot,hit=pool[0];
    for(var i=0;i<pool.length;i++){roll-=PERK_RAR_W[pool[i].r];if(roll<0){hit=pool[i];break;}}
    picks.push(hit.k);
    pool=pool.filter(function(p){return p.k!==hit.k;});
  }
  return picks.length?picks:null;
}

function todayRowsHTML(id){
  var tk=dateKey(Date.now());
  var rows=logsOf(id).filter(function(l){return dateKey(l.ts)===tk;}).sort(function(a,b){return b.ts-a.ts;});
  if(!rows.length)return '';
  var h='<div class="todaylist"><div class="tl-h">Logged today — tap ✕ if you misclicked</div>';
  rows.forEach(function(l){
    h+='<div class="tlrow"><b>'+fmtW(l.w)+' '+esc(state.unit)+'</b><span class="xr">× '+l.r+(l.s>1?' × '+l.s:'')+' · '+fmtTime(l.ts)+'</span>'+
      '<button class="delbtn" data-action="del-log" data-log="'+l.id+'" aria-label="Remove">✕</button></div>';
  });
  return h+'</div>';
}

function roadLoc(i){return ROAD_LOC[Math.min(i,ROAD_LOC.length-1)];}
function questsFor(i){
  var b=BOSSES[i];if(!b)return [];
  var vol=Math.max(2000,Math.round(b.hp*0.4/500)*500);
  var sets=20+i*4;
  var days=2+(i>>2);
  var kills=6+i*2;
  var qs=[
    {t:'volume',target:vol,ask:'My POKEMON tired out hauling berries… Move '+vol.toLocaleString()+' '+state.unit+' of iron for me!',reward:200+i*100},
    (i%2?{t:'days',target:days,ask:'Consistency beats intensity! Train on '+days+' different days.',reward:150+i*75}
        :{t:'sets',target:sets,ask:'My back aches just watching you… Log '+sets+' sets!',reward:150+i*75}),
    {t:'kills',target:kills,ask:'Wild POKEMON block the path ahead — tire out '+kills+' of them in training!',reward:150+i*75}
  ];

/* your RIVAL ambushes on these roads with the counter-starter, evolving as you go */
var RIVAL_ROADS={0:0,3:1,5:1,8:2};
function rivalLine(){
  var st=state.game&&state.game.starter;
  if(state.region==='hoenn'){
    if(st==='torchic')return ['mudkip','marshtomp','swampert'];
    if(st==='mudkip')return ['treecko','grovyle','sceptile'];
    return ['torchic','combusken','blaziken'];

/* the rival is the other Littleroot kid in Hoenn, BLUE in Kanto */
function rivalDef(){

    return mePl==='may'?{cls:'brendan',name:'BRENDAN'}:{cls:'may',name:'MAY'};
  }

function mbFor(i,j){
  var b=BOSSES[i];
  if(j===2&&RIVAL_ROADS[i]!==undefined){
    var rsp=rivalLine()[RIVAL_ROADS[i]];
    var rlv=Math.max(5,b.lv-1);
    var rd=rivalDef();
    return {cls:rd.cls,clsN:'RIVAL',name:rd.name,sp:rsp,lv:rlv,
      hp:Math.round((600+rlv*60)*1.9),purse:rlv*60,arena:roadLoc(i).arena,rival:true};
  }
  var c=TRAINER_CLASSES[(i*2+j)%TRAINER_CLASSES.length];
  var lv=Math.max(4,b.lv-4+j*3);
  var hp=Math.round((600+lv*60)*1.35);
  return {cls:c[0],clsN:c[1],name:TRAINER_NAMES[(i*2+j)%TRAINER_NAMES.length],
    sp:c[2][(i+j)%c[2].length],lv:lv,hp:hp,purse:lv*30,arena:roadLoc(i).arena};
}
function roadMbCount(i){return RIVAL_ROADS[i]!==undefined?3:2;}
function ensureRoad(){
  var g=state.game;if(!g)return;
  if(!g.boss){if(g.road){g.road=null;save();}return;}
  var idx=g.boss.idx,rd=g.round||1;
  if(!g.road||g.road.idx!==idx||g.road.round!==rd){
    g.road={idx:idx,round:rd,startTs:Date.now(),kills:0,mb:{},qdone:{}};
    save();
  }
}
function roadActive(){
  // the league gauntlet past Victory Road has no side roads — just glory
  return !!(state.game&&state.game.road&&state.game.boss&&
    state.game.boss.idx<=8&&state.game.road.idx===state.game.boss.idx);
}
function setsSince(ts){var n=0;allLogsFlat().forEach(function(o){if(o.l.ts>=ts)n+=o.l.s;});return n;}
function daysSinceTs(ts){
  var d={};
  allLogsFlat().forEach(function(o){if(o.l.ts>=ts)d[dateKey(o.l.ts)]=1;});
  return Object.keys(d).length;
}
function questProg(q){
  var r=state.game&&state.game.road;if(!r)return 0;
  if(q.t==='volume')return Math.min(q.target,Math.round(volumeSince(r.startTs)));
  if(q.t==='sets')return Math.min(q.target,setsSince(r.startTs));
  if(q.t==='days')return Math.min(q.target,daysSinceTs(r.startTs));
  if(q.t==='kills')return Math.min(q.target,r.kills||0);
  return 0;
}
/* a quest is READY when trained enough — the reward waits until YOU collect it */
function questReady(q){return questProg(q)>=q.target;}
function questClaimed(qi){
  var r=state.game&&state.game.road;
  return !!(r&&r.qdone&&r.qdone[qi]);
}
function roadClear(){
  if(!roadActive())return true;
  var r=state.game.road,qs=questsFor(r.idx);
  for(var qi=0;qi<qs.length;qi++)if(!questClaimed(qi))return false;
  for(var j=0;j<roadMbCount(r.idx);j++)if(!r.mb[j])return false;
  return true;
}

function todayKey(){return dateKey(Date.now());}
function dayGap(a,b){ /* calendar days between two YYYY-MM-DD keys */
  try{return Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/86400000);}catch(e){return 99;}
}
var DAILY_POOL=[
  {t:'sets',target:10,ask:'Log 10 sets today',reward:200,sp:'machop'},
  {t:'vol',target:5000,ask:'Move 5,000 '+'kg'+' today',reward:250,sp:'geodude'},
  {t:'kills',target:4,ask:'Tire out 4 wild POKEMON today',reward:200,sp:'pidgey'},
  {t:'groups',target:2,ask:'Train 2 different muscle groups today',reward:200,sp:'eevee'},
  {t:'ex',target:4,ask:'Log sets in 4 different exercises today',reward:200,sp:'pikachu'},
  {t:'session',target:1,ask:'Finish a workout today',reward:150,sp:'snorlax'}
];
function ensureDaily(){
  var g=state.game;if(!g)return;
  var tk=todayKey();
  if(!g.daily||g.daily.date!==tk){
    g.daily={date:tk,claimed:{},kills:(g.daily&&g.daily.date===tk?g.daily.kills:0)||0,
      streak:(g.daily&&g.daily.streak)||0,lastDone:(g.daily&&g.daily.lastDone)||null};
    save();
  }
}
function dailyFor(){
  var tk=todayKey();
  var h=0;for(var i=0;i<tk.length;i++)h=(h*31+tk.charCodeAt(i))>>>0;
  var picks=[],used={};
  for(var j=0;j<3;j++){
    var ix=(h+j*7)%DAILY_POOL.length;
    while(used[ix])ix=(ix+1)%DAILY_POOL.length;
    used[ix]=1;picks.push(DAILY_POOL[ix]);
  }
  return picks;
}
function dailyProg(q){
  var tk=todayKey(),v=0,groups={},exs={};
  if(q.t==='kills')return Math.min(q.target,(state.game&&state.game.daily&&state.game.daily.kills)||0);
  if(q.t==='session'){
    var n=0;(state.sessions||[]).forEach(function(s){if(dateKey(s.end)===tk)n++;});
    return Math.min(q.target,n);
  }
  state.groups.forEach(function(g){
    g.exercises.forEach(function(ex){
      ((state.logs&&state.logs[ex.id])||[]).forEach(function(l){
        if(dateKey(l.ts)!==tk)return;
        if(q.t==='sets')v+=l.s;
        else if(q.t==='vol')v+=l.w*l.r*l.s;
        else if(q.t==='groups')groups[g.id]=1;
        else if(q.t==='ex')exs[ex.id]=1;
      });
    });
  });
  if(q.t==='groups')v=Object.keys(groups).length;
  if(q.t==='ex')v=Object.keys(exs).length;
  return Math.min(q.target,Math.round(v));
}
function dailyBumpKill(){
  var g=state.game;if(!g)return;
  ensureDaily();
  g.daily.kills=(g.daily.kills||0)+1;
}

/* everything waiting to be collected — the QUEST tab dot tracks NEW items only */
function claimableList(){
  var g=state.game,out=[];if(!g)return out;
  if(roadActive()){
    var qs=questsFor(g.road.idx);
    for(var qi=0;qi<qs.length;qi++)if(questReady(qs[qi])&&!questClaimed(qi))out.push('r'+g.road.idx+'.'+qi);
  }
  if(g.daily){
    var ds=dailyFor();
    for(var di=0;di<ds.length;di++)if(dailyProg(ds[di])>=ds[di].target&&!g.daily.claimed[di])out.push('d'+g.daily.date+'.'+di);
  }
  if(g.npcq&&featOn('collectors')){
    for(var ni=0;ni<NPCQ.length;ni++){
      var nq=NPCQ[ni];
      if(npcqOpen(nq)&&npcqProg(nq)>=nq.target&&!g.npcq.claimed[nq.k])out.push('n'+nq.k);
    }
  }
  return out;
}

/* Gen 3/4 capture check: rate × ball, easier at low HP; returns shakes for the show */
function catchCheck(w,ballMult){
  var M=Math.max(1,w.max),H=Math.max(1,w.hp);
  var a=Math.floor((3*M-2*H)*catchRateOf(w.sp)*ballMult/(3*M));
  a=Math.floor(a*(1+0.10*perkN('ballmaestro'))); // v6.8 BALL MAESTRO
  if(a>=255)return {caught:true,shakes:4};
  var b=Math.floor(1048560/Math.sqrt(Math.sqrt(16711680/Math.max(1,a))));
  var shakes=0;
  for(var i=0;i<4;i++){if(Math.floor(Math.random()*65536)<b)shakes++;else break;}
  return {caught:shakes===4,shakes:shakes};
}
/* the % shown on the ball picker — chance all four shake checks pass */
function catchOdds(w,ballMult){
  var M=Math.max(1,w.max),H=Math.max(1,w.hp);
  var a=Math.floor((3*M-2*H)*catchRateOf(w.sp)*ballMult/(3*M));
  a=Math.floor(a*(1+0.10*perkN('ballmaestro'))); // v6.8 — the shown % matches the check
  if(a>=255)return 100;
  var b=Math.floor(1048560/Math.sqrt(Math.sqrt(16711680/Math.max(1,a))));
  return Math.max(1,Math.round(Math.pow(Math.min(1,b/65536),4)*100));
}

function restOf(){if(!state.game)return {};if(!state.game.rest)state.game.rest={};return state.game.rest;}
function resolveRests(){
  if(!state.game||state.session)return;
  var r=restOf(),now=Date.now(),changed=false;
  Object.keys(r).forEach(function(uid){
    if(r[uid]<=now){
      delete r[uid];
      if(state.game.hurt)delete state.game.hurt[uid];
      changed=true;
    }
  });
  if(changed)save();
}
function restLeftLabel(uid){
  var ms=Math.max(0,restOf()[uid]-Date.now());
  var hh=Math.floor(ms/3600000),mm=Math.ceil(ms%3600000/60000);
  if(mm===60){hh++;mm=0;}
  return hh>0?hh+'h '+mm+'m':mm+'m';
}

function sprPath(sp,shiny){return 'sprites/'+(shiny?'shiny/':'')+DEX[sp].id+'.png';}

function monLevel(xp){var l=1;while(l<100&&xp>=xpFloor(l+1))l++;return l;}
function statsAt(sp,l){
  var b=DEX[sp].bs;
  return {hp:Math.floor(2*b[0]*l/100)+l+10,
    atk:Math.floor(2*b[1]*l/100)+5,def:Math.floor(2*b[2]*l/100)+5,
    spa:Math.floor(2*b[3]*l/100)+5,spd:Math.floor(2*b[4]*l/100)+5,
    spe:Math.floor(2*b[5]*l/100)+5};
}
/* stats including permanent vitamin boosts (+5 per dose, max 5 doses per stat) */
function statsFor(m){
  var s=statsAt(m.sp,monLevel(m.xp));
  if(m.vits)for(var k in m.vits)if(s[k]!==undefined)s[k]+=5*m.vits[k];
  var vs=perkN('vitalspirit'); // v6.8 — player mons only (wilds/bosses use raw tables)
  if(vs)s.hp=Math.round(s.hp*(1+0.10*vs));
  return s;
}

/* v6.3: while a set is being resolved, the FIGHTER's level-up plays INSIDE the battle
   (flash + GBA stat sheet) instead of a modal; everyone else keeps the modal */
var pendingLvCapture=null;
function queueLevelUp(mon,before,after){
  var s0=statsAt(mon.sp,before),s1=statsAt(mon.sp,after),nm=DEX[mon.sp].n;
  var isFighter=!!(state.session&&state.game&&(mon.uid===state.game.active||(state.session.lead&&mon.uid===state.session.lead)));
  if(pendingLvCapture&&isFighter){
    pendingLvCapture.push({n:nm,to:after,s0:s0,s1:s1});
  }else{
    queueModal(function(){
      sfx('levelup');
      showModal('<h3>'+esc(nm)+' grew to LV '+after+'!</h3>'+statGainGrid(s0,s1)+
        '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>');
      modalOk=function(){closeModal();};
    });
  }
  var mvs=movesFor(mon.sp);
  for(var li=0;li<mvs.length;li++){
    if(mvs[li][0]>before&&mvs[li][0]<=after){
      (function(mv){
        queueModal(function(){
          sfx('save');
          showModal('<h3>'+esc(nm)+' learned '+esc(mv)+'!</h3>'+
            '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>');
          modalOk=function(){closeModal();};
        });
      })(mvs[li][1]);
    }
  }
  maybeEvolve(mon);
}
function maybeEvolve(mon){
  var ev=evoOf(mon.sp);if(!ev)return;
  if(monLevel(mon.xp)<ev.lv)return;
  if(ev.choice){
    queueModal(function(){
      var h='<h3>'+esc(DEX[mon.sp].n)+' is ready to evolve!</h3><p>Choose its evolution:</p>';
      ev.choice.forEach(function(c){
        h+='<button class="prow" data-action="evo-choice" data-m="'+mon.uid+'" data-to="'+c+'">'+
          '<img class="pspr" src="'+sprPath(c,mon.shiny)+'" alt=""><span class="pname">'+DEX[c].n+'</span></button>';
      });
      h+='<div class="mbtns"><button class="btn" data-action="modal-ok">NOT NOW</button></div>';
      showModal(h,true);
      modalOk=function(){closeModal();};
    });
    return;
  }
  var to=ev.to;
  queueModal(function(){
    showModal('<h3>What?</h3><p>'+esc(DEX[mon.sp].n)+' is evolving!</p>'+
      '<div style="text-align:center;padding:8px 0"><img class="bigspr evoflash" src="'+sprPath(mon.sp,mon.shiny)+'" alt=""></div>'+
      '<div class="mbtns"><button class="btn acc" data-action="modal-ok">. . .</button></div>',true);
    modalOk=function(){
      // the classic morph: white silhouette pulses, old shape becomes the new one
      showModal('<h3 style="text-align:center">. . .</h3>'+
        '<div class="evomorph"><img class="em-old" src="'+sprPath(mon.sp,mon.shiny)+'" alt="">'+
        '<img class="em-new" src="'+sprPath(to,mon.shiny)+'" alt=""></div>',true);
      modalOk=null;
      sfx('evolve');
      setTimeout(function(){closeModal();doEvolve(mon,to);},2650);
    };
  });
}
function doEvolve(mon,to){
  var fromN=DEX[mon.sp].n;
  mon.sp=to;
  registerDex(to,mon.shiny);
  save();
  queueModal(function(){
    sfx('evolve');
    showModal('<h3>Congratulations!</h3><p>Your '+esc(fromN)+' evolved into '+esc(DEX[to].n)+'!</p>'+
      '<div style="text-align:center;padding:8px 0"><img class="bigspr'+(mon.shiny?' shinyglow':'')+'" src="'+sprPath(to,mon.shiny)+'" alt=""></div>'+
      '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>',true);
    modalOk=function(){closeModal();render(true);};
  });
  maybeEvolve(mon);
}

function groupVolumeSince(gk,ts){

    g.exercises.forEach(function(e){
      logsOf(e.id).forEach(function(l){if(l.ts>=ts)v+=l.w*l.r*l.s;});

var CATCH_FAIL_LINES=['Oh, no! The POKEMON broke free!','Aww! It appeared to be caught!','Aargh! Almost had it!','Gah! It was so close, too!'];
function runThrow(bk){
  var s=state.session;
  if(throwBusy||!s||s.mode!=='train'||!s.wild||s.wild.tr||s.blackout)return;
  var w=s.wild;
  if(w.ghost===5)return; // the MAROWAK ghost passes right through balls
  var bag=bagOf(),isSafari=!!w.safari;
  if(!ITEMS[bk]||!ITEMS[bk].mult)return;
  if(isSafari){
    if(bk!=='safariball'||(poiOf('safari').balls||0)<=0)return;
  }else{
    if(bk==='safariball'||(bag[bk]||0)<=0)return;
  }
  // everything is decided and SAVED up front — the animation is pure theatre,
  // so an interrupted throw can never eat a ball without paying out
  if(isSafari)poiOf('safari').balls--;
  else bag[bk]--;
  var res=catchCheck(w,ballMultFor(w,bk));
  var wPre={sp:w.sp,lv:w.lv,hp:Math.max(0,w.hp),max:w.max,shiny:w.shiny};
  var safariOver=isSafari&&(poiOf('safari').balls||0)<=0;
  var fled=false;
  if(res.caught){
    var cm=addMon(w.sp,w.shiny);
    cm.xp=xpFloor(w.lv); // it keeps the level it fought at
    if(w.ghost!==undefined){ // a caught ghost is a spirit at rest too
      var pgc=poiOf('tower2');
      if((pgc.floor||0)===w.ghost)pgc.floor=(pgc.floor||0)+1;
    }
    if(w.pyre!==undefined){ // MT. PYRE: catching also lays the spirit to rest
      var ppc=poiOf('pyre');
      if((ppc.floor||0)===w.pyre)ppc.floor=(ppc.floor||0)+1;
    }
    if(w.sky!==undefined){ // SKY PILLAR: a caught guardian clears its floor
      var psc=poiOf('sky');
      if((psc.floor||0)===w.sky)psc.floor=(psc.floor||0)+1;
    }
    if(safariOver)poiOf('safari').active=0;
    s.wild=spawnWild();
    s.bmsg='A wild '+DEX[s.wild.sp].n+' appeared!'+(s.wild.safari?' THROW BALL when ready!':' Log a set to attack — it fights back!');
  }else{
    /* v6.9 BALL SAVER: a missed throw can bounce right back to the bag */
    if(!isSafari&&Math.random()<0.08*perkN('ballsaver')){
      bag[bk]=(bag[bk]||0)+1;
      setTimeout(function(){toast('BALL SAVER — the '+ITEMS[bk].n+' bounced back to your bag!');},1700);
    }
    fled=isSafari&&Math.random()<0.35;
    if(safariOver)poiOf('safari').active=0;
    if(fled||safariOver){
      s.wild=spawnWild();
      s.bmsg=(fled?'It broke free and fled!':'Out of SAFARI BALLS — the game is over!')+' A wild '+DEX[s.wild.sp].n+' appeared!';
    }else{
      s.bmsg=CATCH_FAIL_LINES[Math.min(3,res.shakes)]+(isSafari?' THROW BALL when ready!':' Log a set to attack!');
    }
  }
  save();
  closeModal();
  throwBusy=true;
  clearBattleAnim();
  var wrap=bw();
  if(!wrap){throwBusy=false;render(true);return;}
  // the panel keeps showing the PRE-throw wild while the ball flies
  wrap.innerHTML=wildPanelHTML(false,{wild:wPre,lead:leadMon()});
  alignBack();
  var scene=bq('.arenabg'),espr=bq('.bt-espr');
  typeMsg(playerName()+' used '+ITEMS[bk].n+'!');
  sfx('throw');
  var ball=document.createElement('img');
  var bImg=ITEM_IMG_OVR[bk];
  ball.src=bImg?bImg.src:itemIcon(bk);ball.className='bball bfly';ball.alt='';
  if(bImg)ball.style.filter=bImg.f;
  if(scene)scene.appendChild(ball);
  var T=animTimers;
  T.push(setTimeout(function(){
    if(espr)espr.classList.add('intoball');
    sfx('ballopen');
  },440));
  T.push(setTimeout(function(){
    // land: pin position inline, then bounce (later classes only animate transform/filter)
    ball.style.left='63%';ball.style.bottom='47%';
    ball.classList.remove('bfly');ball.classList.add('bdrop');
  },540));
  T.push(setTimeout(function(){ball.style.transform='translateY(44px)';},1080));
  var rocks=res.caught?3:Math.min(3,res.shakes);
  for(var ri=0;ri<rocks;ri++){
    (function(ix){T.push(setTimeout(function(){
      ball.classList.remove('bdrop','brock');void ball.offsetWidth;ball.classList.add('brock');
      sfx('ballshake');
    },1300+ix*720));})(ri);
  }
  var endT=1300+rocks*720+120;
  if(res.caught){
    T.push(setTimeout(function(){
      ball.classList.add('bok');
      sfx('ballclick');
      var st=document.createElement('div');st.className='catchstars';
      st.innerHTML='<span>★</span><span>★</span><span>★</span>';
      if(scene)scene.appendChild(st);
      typeMsg('Gotcha! '+DEX[wPre.sp].n+' was caught!');
    },endT));
    T.push(setTimeout(function(){
      throwBusy=false;
      announceCatch(wPre.sp,wPre.shiny,wPre.lv);
      if(safariOver){
        queueModal(function(){
          showModal('<h3>GAME OVER</h3><p>That was your last SAFARI BALL — what a way to spend it! The warden waves you out.</p>'+
            '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>');
          modalOk=function(){closeModal();render(true);};
        });
      }
      checkGameEvents();
      updateBattlePanel();
      sendOutFx('enemy','wild');
    },endT+1600));
  }else{
    T.push(setTimeout(function(){
      ball.classList.add('bpop');
      sfx('ballburst');
      if(espr){espr.classList.remove('intoball');void espr.offsetWidth;espr.classList.add('outball');}
      typeMsg(CATCH_FAIL_LINES[Math.min(3,res.shakes)]);
    },endT));
    T.push(setTimeout(function(){
      throwBusy=false;
      updateBattlePanel();
      if(fled||safariOver){
        sendOutFx('enemy','wild');
        cry(state.session&&state.session.wild?state.session.wild.sp:null);
        typeMsg(state.session?state.session.bmsg:'');
        if(safariOver){
          queueModal(function(){
            showModal('<h3>GAME OVER</h3><p>Out of SAFARI BALLS! The warden pats your shoulder: “Come back with more pocket money!”</p>'+
              '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>');
            modalOk=function(){closeModal();render(true);};
          });
        }
      }
    },endT+1500));
  }
}

function resTasks(sp){
  var g=state.game,d=g.dex[sp],r=(g.res&&g.res[sp])||{};
  var c=Math.max(r.c||0,(d&&d.c)?1:0);
  var out=[
    {n:'OBTAIN it',cur:Math.min(1,c),t:1},
    {n:'OBTAIN 3 of it',cur:Math.min(3,c),t:3},
    {n:'DEFEAT 5 in battle',cur:Math.min(5,r.f||0),t:5},
    {n:'WIN 3 fights with it',cur:Math.min(3,r.v||0),t:3}
  ];
  var ev=DEX[sp].evo;
  if(ev){
    var tg=ev.choice?ev.choice:[ev.to],has=0;
    tg.forEach(function(t2){var d2=g.dex[t2];if(d2&&d2.c)has=1;});
    out.push({n:'OBTAIN its evolution',cur:has,t:1});
  }else{
    var lv30=0;
    g.mons.forEach(function(m){if(m.sp===sp&&monLevel(m.xp)>=30)lv30=1;});
    out.push({n:'RAISE one to :L30',cur:lv30,t:1});
  }
  return out;
}
function resDone(sp){
  var n=0;
  resTasks(sp).forEach(function(t){if(t.cur>=t.t)n++;});
  return n;
}
function resComplete(sp){return resDone(sp)>=4;}
function resCount(){
  var n=0;
  DEX_ORDER.forEach(function(sp){if(resComplete(sp))n++;});
  return n;
}
function resClaimable(sp){
  var d=state.game.dex[sp];
  if(!(d&&d.c))return false;
  var r=(state.game.res&&state.game.res[sp])||{};

}

  if(state.session&&state.session.lead){var m=findMon(state.session.lead);if(m)return m;}
  return activeMon();
}
function partyMons(){
  if(!state.session||!state.session.party)return battleParty();
  return state.session.party.map(findMon).filter(Boolean);
}
function alivePartyMons(){return partyMons().filter(function(m){return curHpOf(m)>0;});}
function initBossSession(){
  if(!state.game||!state.session)return;
  var party=battleParty();
  var ids=party.map(function(m){return m.uid;});
  // the XP mon chosen at start always joins the squad, even outside the top six
  if(state.game.active&&ids.indexOf(state.game.active)<0){
    var extra=findMon(state.game.active);
    if(extra){party.push(extra);ids.push(extra.uid);}
  }
  state.session.party=ids;
  state.session.phps={};
  var hurt=(state.game.hurt||{});
  party.forEach(function(m){
    var hv=hurt[m.uid];
    state.session.phps[m.uid]=(hv!==undefined)?Math.max(0,Math.min(hv,maxHpOf(m))):maxHpOf(m);
  });
  var lead=(state.game.active&&ids.indexOf(state.game.active)>=0)?state.game.active:(ids[0]||null);
  if(lead&&state.session.phps[lead]<=0){
    var alive=null;
    ids.forEach(function(u){if(!alive&&state.session.phps[u]>0)alive=u;});
    if(alive)lead=alive;
    else state.session.blackout=true;
  }
  state.session.lead=lead;if(lead)state.game.active=lead;
  save();
}
/* boss type hitting your mon (defensive matchup) */
function typeEffAgainst(atkType,defTypes){
  var e=1;(defTypes||[]).forEach(function(t){
    if(EFF2[atkType]&&EFF2[atkType][t]!==undefined)e*=EFF2[atkType][t];
  });
  return e;
}
function bossCounterDamage(bz,mon){
  var st=statsFor(mon);
  var eff=typeEffAgainst(bz.type,DEX[mon.sp].t);
  var def=(st.def+st.spd)/2;
  var raw=(bz.lv*1.7+6)*eff;
  return {dmg:Math.max(1,Math.round(raw*45/(45+def))),eff:eff};
}
function applyBossCounter(bz,lead){
  if(!state.session.phps)state.session.phps={};
  var c=bossCounterDamage(bz,lead);
  var mx=maxHpOf(lead);
  var from=Math.round(Math.max(0,curHpOf(lead))/Math.max(1,mx)*100);
  /* v6.8 perks: SWIFT STEP dodge, IRON GUARD cut, GUARDIAN ANGEL save */
  var dodged=Math.random()<0.04*perkN('swiftstep');
  var hitDmg=dodged?0:Math.max(dodged?0:1,Math.round(c.dmg*(1-Math.min(0.4,0.08*perkN('ironguard')))));
  var saved=false;
  if(!dodged&&curHpOf(lead)-hitDmg<=0&&(state.session.gaUsed||0)<perkN('guardian')&&curHpOf(lead)>1){
    hitDmg=curHpOf(lead)-1;state.session.gaUsed=(state.session.gaUsed||0)+1;saved=true;
  }
  state.session.phps[lead.uid]=Math.max(0,curHpOf(lead)-hitDmg);
  var to=Math.round(state.session.phps[lead.uid]/Math.max(1,mx)*100);
  var ctxt=c.eff>=2?' A heavy blow!':(c.eff>1?' It hit hard!':(c.eff<1?' '+DEX[lead.sp].n+' shrugged it off.':''));
  var res={dmg:hitDmg,php:[from,to],msg:dodged?(bz.mon+' struck back — but '+DEX[lead.sp].n+' DODGED it!')
    :(bz.mon+' struck back — '+hitDmg+' dmg!'+ctxt+(saved?' GUARDIAN ANGEL — '+DEX[lead.sp].n+' hung on at 1 HP!':'')),fainted:false,faintMsg:null,goMsg:null};
  state.session.bmsg+=' '+res.msg;
  if(state.session.phps[lead.uid]<=0){
    res.fainted=true;
    var f=handleLeadFaint(lead);
    res.faintMsg=f.msg;res.goMsg=f.goMsg;
  }
  return res;
}
/* wilds bite back too — lighter than bosses, route trainers hit harder */
function applyWildCounter(wd,lead){
  if(!state.session.phps)state.session.phps={};
  var st=statsFor(lead);
  var atype=(DEX[wd.sp].t&&DEX[wd.sp].t[0])||null;
  var eff=atype?typeEffAgainst(atype,DEX[lead.sp].t):1;
  var raw=(wd.lv*(wd.tr?1.6:1.15)+3)*eff;
  var def=(st.def+st.spd)/2;
  var dmg=Math.max(1,Math.round(raw*45/(45+def)));
  var mx=maxHpOf(lead);
  var from=Math.round(Math.max(0,curHpOf(lead))/Math.max(1,mx)*100);
  /* v6.8 perks: SWIFT STEP dodge, IRON GUARD cut, GUARDIAN ANGEL save */
  var wdodge=Math.random()<0.04*perkN('swiftstep');
  if(wdodge)dmg=0;
  else dmg=Math.max(1,Math.round(dmg*(1-Math.min(0.4,0.08*perkN('ironguard')))));
  var wsaved=false;
  if(!wdodge&&curHpOf(lead)-dmg<=0&&(state.session.gaUsed||0)<perkN('guardian')&&curHpOf(lead)>1){
    dmg=curHpOf(lead)-1;state.session.gaUsed=(state.session.gaUsed||0)+1;wsaved=true;
  }
  state.session.phps[lead.uid]=Math.max(0,curHpOf(lead)-dmg);
  var to=Math.round(state.session.phps[lead.uid]/Math.max(1,mx)*100);
  var res={dmg:dmg,php:[from,to],msg:wdodge?((wd.tr?DEX[wd.sp].n:'Wild '+DEX[wd.sp].n)+' fought back — but '+DEX[lead.sp].n+' DODGED it!')
    :((wd.tr?DEX[wd.sp].n:'Wild '+DEX[wd.sp].n)+' fought back — '+dmg+' dmg!'+(wsaved?' GUARDIAN ANGEL — '+DEX[lead.sp].n+' hung on at 1 HP!':'')),fainted:false,faintMsg:null,goMsg:null};
  state.session.bmsg+=' '+res.msg;
  if(state.session.phps[lead.uid]<=0){
    res.fainted=true;
    if(lead.uid==='bfrent'){
      /* FACTORY (v6.2): a fallen rental ends the run — your own team never fainted */
      res.faintMsg='The rental '+DEX[lead.sp].n+' is unable to battle! The FACTORY run is over.';
      bfFactoryFail();
      state.session.wild=spawnWild();
      var rnew=DEX[state.session.wild.sp].n;
      state.session.bmsg='The rental fell — the FACTORY run ends. Back to training: a wild '+rnew+' appeared!';
      res.goMsg='Back to normal training! A wild '+rnew+' appeared!';
    }else{
      var f=handleLeadFaint(lead);
      res.faintMsg=f.msg;res.goMsg=f.goMsg;
    }
  }
  return res;
}
function handleLeadFaint(lead){
  state.session.bmsg+=' '+DEX[lead.sp].n+' is unable to battle!';
  // next teammate in PARTY ORDER tanks (set yours via TEAM → EDIT PARTY)
  var order=partyMons(),nxt=null;
  for(var i=0;i<order.length;i++){
    if(order[i].uid!==lead.uid&&curHpOf(order[i])>0){nxt=order[i];break;}
  }
  var out={msg:DEX[lead.sp].n+' is unable to battle!',goMsg:null};
  if(nxt){
    state.session.lead=nxt.uid;state.game.active=nxt.uid;
    state.session.bmsg+=' Go, '+DEX[nxt.sp].n+'!';
    out.goMsg='Go, '+DEX[nxt.sp].n+'!';
  }else triggerBlackout();
  return out;
}
function triggerBlackout(){
  state.session.blackout=true;
  // fainting to a FRONTIER ACE ends the tower streak, like the real Battle Tower
  var bw2=state.session.wild;
  if(bw2&&bw2.tr&&bw2.tr.front!==undefined){
    var pfb=poiOf('front');
    if(pfb.streak)toast('Your BATTLE TOWER streak of '+pfb.streak+' ends…');
    pfb.streak=0;
  }
  /* v6.2: a blackout in a FRONTIER facility ends that run, canon-style */
  if(bw2&&bw2.tr&&bw2.tr.bf){
    var bfc3=bw2.tr.bf[0],bfp3=bfOf();
    if(bfc3==='tw'){if(bfp3.tw.streak)toast('The TOWER streak of '+bfp3.tw.streak+' ends…');bfp3.tw.streak=0;}
    else if(bfc3==='pl'){if(bfp3.pl.streak)toast('The PALACE streak of '+bfp3.pl.streak+' ends…');bfp3.pl.streak=0;}
    else if(bfc3==='ar'){if(bfp3.ar.streak)toast('The ARENA streak of '+bfp3.ar.streak+' ends…');bfp3.ar.streak=0;}
    else if(bfc3==='fa')bfFactoryFail();
    else if(bfc3==='dm'){bfp3.dm.rd=0;toast('Knocked out of the DOME bracket…');}
    else if(bfc3==='pk'){bfp3.pk.room=0;bfp3.pk.pend=0;toast('Carried out of the PIKE…');}
    else if(bfc3==='py'){bfp3.py.floor=0;toast('You wake at the PYRAMID base — the climb resets…');}
  }
  var bz=bossInfo();
  if(bz)state.game.boss.hp=Math.min(bz.max,state.game.boss.hp+Math.round(bz.max*0.25));
  var bz2=bossInfo();
  state.session.bmsg='Your whole team fainted! You blacked out'+(bz2?' — '+bz2.n+' recovered some HP':'')+'. Sets now earn XP only; heal up by your next workout.';
  // let the faint animation finish before the modal drops
  setTimeout(function(){
    queueModal(function(){
      sfx('faint');
      showModal('<h3>Blacked out!</h3><p>'+esc(playerName())+'’s team was defeated. '+(bz2?esc(bz2.n)+' recovered 25% HP. ':'')+'Your sets still earn XP this workout — level up and come back stronger!</p>'+
        '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>',true);
      modalOk=function(){closeModal();};
    });
  },2400);
}
/* LEFTOVERS nibble: the holder tops up after every exchange it survives */
function leftoversStep(am){
  if(heldOf(am)!=='leftovers')return null;
  var lmx=maxHpOf(am),lc=Math.max(0,curHpOf(am));
  if(lc<=0||lc>=lmx)return null;
  var lheal=Math.max(3,Math.round(lmx/16));
  var lfrom=Math.round(lc/lmx*100);
  state.session.phps[am.uid]=Math.min(lmx,lc+lheal);
  state.session.bmsg+=' '+DEX[am.sp].n+' restored HP with LEFTOVERS.';
  return {msg:DEX[am.sp].n+' restored a little HP with its LEFTOVERS!',sfx:'save',
    php:[lfrom,Math.round(state.session.phps[am.uid]/lmx*100)],hold:900};
}
function insertBeforeRefresh(steps,st){
  if(!st)return;
  var li=steps.length;
  while(li>0&&steps[li-1].refresh)li--;
  steps.splice(li,0,st);
}
/* One logged set in boss mode = one full battle exchange, played out in stages. */
function resolveBossSet(am,entry,vol,id){
  if(!state.session.party)initBossSession();
  var bz=bossInfo(),exr=exById(id);
  if(!bz||!exr)return;
  if(state.session.blackout){
    state.session.bmsg=DEX[am.sp].n+' keeps training! +'+(entry.xpg||0)+' XP. (Blacked out — no boss damage this workout.)';
    pendingSteps={ov:null,list:[{msg:state.session.bmsg}]};
    return;
  }
  // your chosen move decides the type now — pick it via the MOVE button
  var mvName=curMoveFor(am,bz),mvType=moveTypeOf(mvName);
  var eff=effOfType(mvType,bz.type);
  var stA=statsFor(am);
  var boosted=!!state.session.xatkArmed;
  if(boosted){state.session.xatkArmed=false;state.session.xatkUsed=true;}
  // speed = crit chance, the gen-1 way (capped at 25%); SCOPE LENS stacks on top
  // v6.7: a set at ≥95% of your record always crits — PERFECT FORM (v6.8: FORM MASTER lowers to 90%)
  var crit=(entry.rel>=pfT())||Math.random()<Math.min(0.25,stA.spe/400)+heldCritBonus(am)+0.04*perkN('keeneye');
  var dmg=Math.round(vol*eff*(1+Math.max(stA.atk,stA.spa)/250)*(boosted?1.5:1)*(crit?(1.5+0.15*perkN('sharplens')):1)*heldBoostFor(am,mvType)*(1+0.06*perkN('powerbrace'))*(1+0.2*perkN('titanslayer')));
  var ehpFrom=Math.round(bz.memberHp/Math.max(1,bz.memberMax)*100);
  var hpBefore=state.game.boss.hp;
  state.game.boss.hp-=dmg;
  entry.dmg=dmg;entry.bidx=bz.idx;
  var effTxt=eff>=2?" It's super effective!":(eff<=0.3?' It barely affects it…':(eff<1?" It's not very effective…":''));
  var hitSfx=(crit||eff>=2)?'superhit':(eff<=0.3?'weakhit':'hit');
  var atkMsg=DEX[am.sp].n+' used '+mvName+'!'+(crit?((entry.rel>=pfT())?' PERFECT FORM — critical hit!':' A critical hit!'):'')+(boosted?' X ATTACK boost!':'')+effTxt;
  state.session.bmsg=atkMsg+' '+dmg.toLocaleString()+' dmg.';
  var steps=[];
  if(state.game.boss.hp<=0){
    // the finisher takes the last mon's classic trainer EXP before the concede plays
    var koF=Math.max(5,Math.round(expYieldOf(bz.monId)*bz.lv/7*1.5*(state.session.lucky?2:1)));
    entry.xpg=(entry.xpg||0)+koF;entry.mon=am.uid;
    state.session.xpg=(state.session.xpg||0)+koF;
    applyXP(am,koF);
    resBump(am.sp,'v'); // v6.7: boss takedowns count toward field research too
    var eshF=expShareHolder(am.uid);
    if(eshF){var eshFK=Math.max(1,Math.round(koF*eshRate()));applyXP(eshF,eshFK);state.session.xpg=(state.session.xpg||0)+eshFK;}
    steps.push({msg:atkMsg,sfx:hitSfx,movesfx:mvName,lunge:'player',blink:'enemy',ehp:[ehpFrom,0],dmg:['enemy',dmg],fx:mvType});
    steps.push({msg:'Foe '+bz.mon+' is unable to battle! +'+koF+' EXP!',sfx:'faint',cryId:bz.monId,faint:'enemy',hold:1100});
    // the beaten leader steps back out to concede
    steps.push({msg:bz.n+' was defeated!',sfx:'badge',trainer:bz.tr,hold:1600});
    bossDefeated(); // advances the league AND flips the session back to training
    if(state.session&&state.session.mode==='train'&&state.session.wild){
      steps.push({msg:'Back to normal training! A wild '+DEX[state.session.wild.sp].n+' appeared!',
        sfx:'battlestart',cry:state.session.wild.sp,refresh:true,slide:'enemy',hold:1400});
    }else{
      steps.push({refresh:true,hold:0});
    }
    pendingSteps={ov:{enemy:bz,lead:am},list:steps};
    return;
  }
  var after=bossInfo();
  if(after.memberIdx>bz.memberIdx){
    // clean KO: classic trainer EXP (base yield × level / 7 × 1.5) goes to the finisher
    var ko=Math.max(5,Math.round(expYieldOf(bz.monId)*bz.lv/7*1.5*(state.session.lucky?2:1)));
    entry.xpg=(entry.xpg||0)+ko;entry.mon=am.uid;
    state.session.xpg=(state.session.xpg||0)+ko;
    applyXP(am,ko);
    var eshK=expShareHolder(am.uid);
    if(eshK){var eshKK=Math.max(1,Math.round(ko*0.5));applyXP(eshK,eshKK);state.session.xpg=(state.session.xpg||0)+eshKK;}
    state.session.bmsg+=' Foe '+bz.mon+' is unable to battle! +'+ko+' EXP! '+bz.n+' sent out '+after.mon+'!';
    steps.push({msg:atkMsg,sfx:hitSfx,movesfx:mvName,lunge:'player',blink:'enemy',ehp:[ehpFrom,0],dmg:['enemy',dmg],fx:mvType});
    steps.push({msg:'Foe '+bz.mon+' is unable to battle! +'+ko+' EXP!',sfx:'faint',cryId:bz.monId,faint:'enemy',hold:1100});
    steps.push({msg:bz.n+' sent out '+after.mon+'!',sfx:'battlestart',cryId:after.monId,refresh:true,slide:'enemy'});
  }else{
    // member survives → your strike lands first, THEN it hits back
    var ehpTo=Math.round(after.memberHp/Math.max(1,after.memberMax)*100);
    steps.push({msg:atkMsg,sfx:hitSfx,movesfx:mvName,lunge:'player',blink:'enemy',ehp:[ehpFrom,ehpTo],dmg:['enemy',dmg],fx:mvType});
    var ct=applyBossCounter(after,am);
    steps.push({msg:ct.msg,sfx:'hit',lunge:'enemy',blink:'player',php:ct.php,dmg:['player',ct.dmg],quake:true});
    if(ct.fainted){
      steps.push({msg:ct.faintMsg,sfx:'faint',cry:am.sp,faint:'player',hold:1100});
      if(ct.goMsg)steps.push({msg:ct.goMsg,sfx:'battlestart',cry:(findMon(state.session.lead)||{}).sp,refresh:true,slide:'player'});
      else steps.push({msg:'Your whole team fainted! You blacked out…',refresh:true,hold:1400});
    }else{
      steps.push({refresh:true,hold:0});
    }
    if(state.game.boss.hp>0&&state.game.boss.hp/bz.max<0.2&&hpBefore/bz.max>=0.2){
      setTimeout(function(){sfx('lowhp');},1600);
    }
  }
  insertBeforeRefresh(steps,leftoversStep(am));
  insertBeforeRefresh(steps,shellBellStep(am,dmg));
  insertBeforeRefresh(steps,perkWindStep(am)); // v6.8 SECOND WIND
  pendingSteps={ov:{enemy:bz,lead:am},list:steps};
}
function badgeCount(){

  if(g.flags.champion)return 8;
  return Math.min(g.boss?g.boss.idx:0,8);

function spawnWild(){
  // an active SAFARI GAME takes over spawning entirely (catch-only wilds)
  if(safariOn())return safariSpawn();
  // strict biome spawns: weighted pick from THIS area's table only
  var list=areaSpawnList(curTown()),tot=0;
  /* v6.8 RARE MAGNET: rare (3) and very-rare (1) weights climb 50% */
  var wOf=function(e){
    var w=(e[1]<=3&&perkN('raremagnet'))?e[1]*1.5:e[1];
    if(perkN('dexscanner')&&!(state.game.dex[e[0]]&&state.game.dex[e[0]].c))w*=1.3; // hunt the uncaught
    return w;
  };
  list.forEach(function(e){tot+=wOf(e);});
  var roll=Math.random()*tot,sp=list[0][0];
  for(var i=0;i<list.length;i++){roll-=wOf(list[i]);if(roll<0){sp=list[i][0];break;}}

  var band=WILD_BANDS[curTown()]||[2,6];
  var wlv=band[0]+Math.floor(Math.random()*(band[1]-band[0]+1));
  var hp=Math.round((500+wlv*45)*(0.8+Math.random()*0.4));
  if(state.game)state.game.seen[sp]=1; // spotted — its silhouette fills in on the AREA list
  return {sp:sp,lv:wlv,hp:hp,max:hp,shiny:Math.random()<shinyOdds(),parts:{}};
}

function bw(){var els=document.querySelectorAll('.btwrap');return els.length?els[els.length-1]:null;}

/* back sprites are waist-up rips with transparent padding below — measure it once
   per sprite and sink the image so the cut sits EXACTLY on the text bar */
var backPadCache={};
/* pad = transparent rows below the sprite; measured off a standalone probe image so
   it never depends on the DOM element's load/layout state (that was why the GYM-tab
   panel stayed misaligned while the sheet worked) */
function placeBack(src){
  var img=bq('.bt-pspr');
  if(!img||img.getAttribute('src')!==src)return;
  var pad=backPadCache[src];if(pad===undefined)return;
  var nh=64,scale=(img.clientHeight||img.offsetHeight||76)/nh;
  img.style.bottom=(-2-Math.round(pad*scale))+'px';
}
function alignBack(){
  var img=bq('.bt-pspr');if(!img)return;
  var src=img.getAttribute('src');if(!src)return;
  if(backPadCache[src]!==undefined){placeBack(src);return;}
  var probe=new Image();
  probe.onload=function(){
    try{
      var c=document.createElement('canvas');
      c.width=probe.naturalWidth||64;c.height=probe.naturalHeight||64;
      var x=c.getContext('2d');x.drawImage(probe,0,0);
      var d=x.getImageData(0,0,c.width,c.height).data,pad=0;
      outer:for(var y=c.height-1;y>=0;y--){
        for(var xx=0;xx<c.width;xx++){if(d[(y*c.width+xx)*4+3]>8)break outer;}
        pad++;
      }
      /* v6.5: iOS canvas readback can come back EMPTY (memory pressure) — the scan
         then counts the whole sprite as padding and sinks the mon half below the
         floor, cached for the whole fight ("cut in half"). An empty scan means
         failure, and no legit back sprite pads deeper than ~18 rows. */
      if(pad>=c.height)pad=0;
      backPadCache[src]=Math.min(pad,18);
      placeBack(src); // re-query the CURRENT sprite, not the one at call time
    }catch(e){backPadCache[src]=0;}
  };
  probe.src=src;
}

function stepHold(st){
  var base=st.hold||950;
  if(st.msg)base=Math.max(base,st.msg.length*8+520);
  return base;
}
function playBattleSteps(steps){
  var t=0;
  steps.forEach(function(st){
    animTimers.push(setTimeout(function(){runBattleStep(st);},t));
    t+=stepHold(st);
  });
  // xp fill runs alongside the first step, wrapping through 100 on level-up
  if(pendingExp){
    (function(xa){
      animTimers.push(setTimeout(function(){
        if(xa.wrap){
          driftBar('.bt-pexp',100,false);
          animTimers.push(setTimeout(function(){setBarNow('.bt-pexp',0,false);driftBar('.bt-pexp',xa.to,false);},460));
        }else driftBar('.bt-pexp',xa.to,false);
      },420));
    })(pendingExp);
    pendingExp=null;
  }
}
function updateBattlePanel(){
  var w=bw();if(!w)return;
  clearBattleAnim();
  if(pendingSteps){
    var plan=pendingSteps;pendingSteps=null;
    w.innerHTML=battlePanelHTML(false,plan.ov);
    // prime bars at the FIRST step's pre-attack values so drains play out
    var pE=false,pP=false;
    plan.list.forEach(function(st){
      if(st.ehp&&st.ehp.length>1&&!pE){setBarNow('.bt-ehp',st.ehp[0],true);pE=true;}
      if(st.php&&st.php.length>1&&!pP){setBarNow('.bt-php',st.php[0],true);pP=true;}
    });

function bossDefeated(){
  var g=state.game;var bz=bossInfo();if(!bz)return;
  var bonus=Math.round(bz.max/30);
  g.mons.forEach(function(m){m.xp+=bonus;});
  // the leader pays out, like the games
  var purse=Math.round(bz.lv*60*(bz.round||1));
  addMoney(purse);
  // winning revitalises your squad for the next challenger
  if(state.session&&state.session.party){
    state.session.party.forEach(function(uid){var mm=findMon(uid);if(mm)state.session.phps[uid]=maxHpOf(mm);});
    state.session.blackout=false;
  }
  var stayTown=townIdx(); // where you're standing right now, BEFORE the badge advances
  // etch the conquered road into the village's local history (the QUEST page shows it there)
  if(g.road&&g.boss&&g.road.idx===g.boss.idx&&g.boss.idx<ROAD_LOC.length){
    g.roadLog=g.roadLog||{};
    g.roadLog[g.road.idx]={round:g.road.round||1,startTs:g.road.startTs,clearTs:Date.now(),kills:g.road.kills||0};
  }
  var isChamp=bz.idx>=BOSSES.length-1;
  if(isChamp){
    // etch this team into the Hall of Fame
    if(!Array.isArray(g.hof))g.hof=[];
    var snap=(state.session&&state.session.party?partyMons():battleParty()).map(function(m){
      return {sp:m.sp,lv:monLevel(m.xp),shiny:!!m.shiny};
    });
    g.hof.push({ts:Date.now(),round:bz.round,team:snap});
  }
  if(isChamp){
    g.flags.champion=1;
    g.round=(g.round||1)+1;
    g.boss={idx:0,hp:hpFor(0,g.round)};
  }
  else g.boss={idx:bz.idx+1,hp:hpFor(bz.idx+1,g.round||1)};
  // NO auto-warp: stay in the town you just won in; the new gym town opens on the MAP
  g.visit=Math.min(stayTown,townIdx());

  if(state.session){
    state.session.mode='train';
    state.session.wild=spawnWild();
    state.session.moveSel={};
    state.session.bmsg='A wild '+DEX[state.session.wild.sp].n+' appeared!';
  }
  save();
  var wildAfter=(state.session&&state.session.wild)?DEX[state.session.wild.sp].n:null;
  // let the final KO animation land before the victory screen
  setTimeout(function(){
  var fin=function(){
  queueModal(function(){
    sfx('victory');
    showModal('<div class="vbanner">VICTORY!</div>'+
      '<div style="text-align:center;padding:6px 0 2px"><img src="sprites/trainers/'+bz.tr+'.png" alt="'+bz.n+'" style="width:72px;height:72px;image-rendering:pixelated"></div>'+
      '<p style="text-align:center;margin:2px 0 8px">'+esc(playerName())+' defeated '+esc(bz.n)+(bz.gym?' of '+esc(bz.gym):'')+'!</p>'+
      '<div class="vrow"><img src="'+itemIcon('pokeball')+'" alt="">Prize money<b style="margin-left:auto">₽'+purse.toLocaleString()+'</b></div>'+
      '<div class="vrow"><img src="'+itemIcon('luckyegg')+'" alt="">Whole team EXP<b style="margin-left:auto">+'+bonus.toLocaleString()+'</b></div>'+
      '<div style="display:flex;align-items:center;gap:6px;margin:4px 0 2px"><span class="barlab" style="color:#88A8E8">EXP</span><div class="gbar exp"><div class="vexp"></div></div></div>'+
      (wildAfter?'<p style="text-align:center;margin:10px 0 0;color:var(--mut)">Your workout continues as <b style="color:#2E8B48">NORMAL TRAINING</b><br>— a wild '+wildAfter+' appeared!</p>':'')+
      '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>',true);
    modalOk=function(){closeModal();};
  });
  queueModal(function(){
    sfx('badge');
    showModal('<h3>'+(bz.badge?esc(bz.badge)+' GET! 🏅':'VICTORY!')+'</h3>'+
      '<p>Your whole team earned +'+bonus+' XP! '+esc(bz.n)+' paid out <b>₽'+Math.round(bz.lv*60*(bz.round||1)).toLocaleString()+'</b>.'+
      (bz.idx<8&&bz.badge?'':(isChamp?'':' Next challenger: '+esc(BOSSES[bz.idx+1].n)+'.'))+'</p>'+
      '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>',true);
    modalOk=function(){closeModal();render(true);};
  });
  /* v6.5: a fresh badge opens a town — the town gets its own curtain call */
  if(bz.idx<8&&bz.badge){
    (function(nt,ni){
      if(!nt)return;
      queueModal(function(){
        fxHold=true;
        playTownFx(nt.img,nt.n);
        sfx('ferry');
        setTimeout(function(){
          fxHold=false;
          showModal('<div class="mapwrap" style="margin:0 0 8px"><img class="mapimg" src="'+nt.img+'" alt="" style="width:100%;display:block;image-rendering:pixelated;aspect-ratio:240/140;object-fit:cover"></div>'+
            '<h3 style="text-align:center">'+nt.n+'</h3>'+
            '<p style="text-align:center;color:var(--mut)">'+(nt.sub||'')+'</p>'+
            '<p style="text-align:center;margin-top:4px">Hop the ferry — the first trip is free!'+(BOSSES[ni]?' '+esc(BOSSES[ni].n)+' awaits at the gym.':'')+'</p>'+
            '<div class="mbtns"><button class="btn acc" data-action="modal-ok">SET SAIL</button></div>',true);
          modalOk=function(){closeModal();render(true);};
        },1900);
      });
    })(TOWNS[Math.min(bz.idx+1,8)],bz.idx+1);
  }
  if(isChamp){
    queueModal(function(){
      sfx('badge');
      showModal('<h3>HALL OF FAME! 🏆</h3><p>'+esc(playerName())+' and team enter the HALL OF FAME! But the league never rests… ROUND '+g.round+' begins: every boss returns, twice as strong.</p>'+
        '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>',true);
      modalOk=function(){closeModal();render(true);};
    });
    grantMon('mewtwo','mewtwo','A legend stirs…','You are the CHAMPION! MEWTWO acknowledges your strength and joins you!');
  }
  };
  // v6.3: a fresh gym badge gets the full ceremony first — then the modals
  if(bz.idx<8&&bz.badge)playBadgeFx(badgeSrcFor(bz.idx),bz.badge,fin);
  else fin();
  },5600); // the KO + concede cameo + back-to-training step play out first
}

  Water:'beauty',Ice:'beauty',Flying:'beauty',Normal:'cute',
  Psychic:'smart',Grass:'smart',Poison:'smart',Ghost:'smart',Bug:'smart',Dark:'smart',
  Rock:'tough',Ground:'tough',Steel:'tough'};
/* the muscle-group → category map: judged by what you ACTUALLY trained this week */
function catOfGroupName(n){
  n=String(n||'').toLowerCase();
  /* muscle words FIRST (a "Leg press" group must stay TOUGH), motion words after */
  if(/leg|quad|ham|calf|glute|fore\s?arm|grip/.test(n))return 'tough';
  if(/pec|chest|tricep|push/.test(n))return 'cool';
  if(/back|lat|row|pull/.test(n))return 'beauty';
  if(/bicep|curl/.test(n))return 'cute';
  if(/shoulder|delt|ab|core/.test(n))return 'smart';
  return null;
}
function catLabelOfGroups(cat){
  var names=[];
  state.groups.forEach(function(g){if(catOfGroupName(g.name)===cat)names.push(g.name);});
  return names.join(' + ')||'—';
}
/* sets logged this calendar week in the groups feeding a category */
function weekSetsFor(cat){
  var ws=weekStartTs(Date.now()),n=0;
  state.groups.forEach(function(g){
    if(catOfGroupName(g.name)!==cat)return;
    g.exercises.forEach(function(e){
      (state.logs[e.id]||[]).forEach(function(l){if(l.ts>=ws)n+=(l.s||1);});
    });
  });
  return n;
}
function weekTrainDays(){
  var ws=weekStartTs(Date.now()),m=daySetsMap(),n=0;
  Object.keys(m).forEach(function(k){var d=new Date(k+'T12:00');if(d.getTime()>=ws)n++;});
  return n;
}
/* a mon's showing in one category: permanent POKEBLOCK feed + this week's real sets */
function condOf(m,cat){return (m.cond&&m.cond[cat])||0;}
function condTotal(m,cat){return condOf(m,cat)+Math.min(120,weekSetsFor(cat)*4);}

    });
    showModal('<h3 style="text-align:center;color:'+catCol+'">'+catLab+' CONTEST — '+CONTEST_RANKS[rank][0]+'</h3>'+
      '<p style="text-align:center;margin:4px 0">ROUND 1 · VISUAL — condition check!</p>'+rows+

/* feed one blended block to the chosen star */
function blendFeed(uid,bk){
  var m=findMon(uid),bag=bagOf();
  if(!m||!ITEMS[bk]||!ITEMS[bk].berry||!(bag[bk]>0))return;
  m.cond=m.cond||{};
  var sheen=(m.cond.sheen||0),add=ITEMS[bk].tier===2?22:14;
  if(sheen+add>255){toast(DEX[m.sp].n+' is too sleek to eat more blocks!');return;}
  var cat=ITEMS[bk].berry,gain=(ITEMS[bk].tier===2?30:18)+2*weekTrainDays();
  gain=Math.round(gain*(1+0.25*perkN('blockartist'))); // v6.9

  m.cond[cat]=Math.min(255,(m.cond[cat]||0)+gain);

  var catCol='#888';CONTEST_CATS.forEach(function(c){if(c[0]===cat)catCol=c[2];});
  toast(DEX[m.sp].n+'’s '+cat.toUpperCase()+' rose by '+gain+'!');

function bwList(){if(!Array.isArray(state.bw))state.bw=[];return state.bw;}
function bwChartSVG(){
  var list=bwList().slice(-30);
  if(list.length<2)return '<div class="memo" style="color:var(--mut)">Log at least two weigh-ins to draw the trend.</div>';
  var W=312,H=120,P=10;
  var min=Infinity,max=-Infinity;
  list.forEach(function(e){if(e.w<min)min=e.w;if(e.w>max)max=e.w;});
  var span=Math.max(1,max-min);min-=span*0.15;max+=span*0.15;span=max-min;
  var pts=list.map(function(e,i){
    var x=P+i/(list.length-1)*(W-2*P);
    var y=H-16-((e.w-min)/span)*(H-30);
    return [x,y];
  });
  var path='M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' L');
  var dots='';
  pts.forEach(function(p,i){
    var last=i===pts.length-1;
    dots+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(last?4:2.5)+'" fill="'+(last?'#E89028':'var(--accent)')+'"/>';
  });
  var first=list[0],lastE=list[list.length-1];

  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
    '<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>'+dots+
    '<text x="'+P+'" y="'+(H-2)+'" style="fill:#787878;font-size:13px;font-family:VT323">'+fmtDayKey(dateKey(first.ts))+'</text>'+
    '<text x="'+(W-P)+'" y="'+(H-2)+'" text-anchor="end" style="fill:#787878;font-size:13px;font-family:VT323">'+fmtDayKey(dateKey(lastE.ts))+' · '+(diff>0?'+':'')+diff+' '+esc(state.unit)+'</text>'+

/* deterministic preview of a facility's next fight — NO side effects (pages call this) */
function bfNext(fac){
  var p=bfOf(),d=bfFacDef(fac),sym=p.sym[fac]||0;
  var pos,salt='',brain=false,strong=false;
  if(fac==='tw'){pos=p.tw.streak;brain=(pos%7===6);}
  else if(fac==='pl'){pos=p.pl.streak;brain=(pos%7===6);}
  else if(fac==='ar'){pos=p.ar.streak;brain=(pos%7===6);}
  else if(fac==='fa'){pos=p.fa.streak;brain=(pos%7===6);}
  else if(fac==='dm'){pos=p.dm.rd;salt='w'+p.dm.wins;brain=(pos===3&&(p.dm.wins===1||p.dm.wins===3));strong=(pos===3&&!brain);}
  else if(fac==='pk'){pos=p.pk.room;salt='c'+p.pk.clears;brain=(pos===9&&(p.pk.clears===1||p.pk.clears===3));strong=(p.pk.pend===2);}
  else {pos=p.py.floor;salt='c'+p.py.clears;brain=(pos===6&&(p.py.clears===1||p.py.clears===3));strong=(pos===6&&!brain);}
  var lv;
  if(fac==='dm')lv=Math.min(100,54+pos*3+p.dm.wins*2);
  else if(fac==='pk')lv=Math.min(100,50+pos+p.pk.clears*4);
  else if(fac==='py')lv=Math.min(100,50+pos*2+p.py.clears*4);
  else lv=Math.min(100,52+pos*2);
  if(brain)lv=Math.min(100,lv+3);
  var h=strHash('bf'+fac+'-'+pos+'-'+salt);
  var tier=brain?(sym<1?1:(sym<2?2:0)):0;
  if(brain){
    return {brain:true,tier:tier,cls:d.brain.cls,clsN:d.brain.clsN,name:d.brain.name,
      sp:d.brain.sp[sym>=1?1:0],lv:lv,pos:pos,strong:false};
  }
  var pool=(fac==='py')?BF_PY_POOL:BF_POOL;
  var tc=TRAINER_CLASSES[h%TRAINER_CLASSES.length];
  var clsN=fac==='dm'?(pos===3?'DOME FINALIST':'DOME CHALLENGER')
    :(fac==='py'?(pos===6?'PYRAMID VALET':'PYRAMID EXPLORER')
    :(fac==='pk'?'PIKE WANDERER':(fac==='fa'?'FACTORY TESTER':'FRONTIER ACE')));
  return {brain:false,tier:0,cls:tc[0],clsN:clsN,name:TRAINER_NAMES[h%TRAINER_NAMES.length],
    sp:pool[h%pool.length],lv:lv,pos:pos,strong:strong};
}

function bfSetupRental(){
  if(!state.session)return;

  var sp=p.fa.team[Math.min(p.fa.lead||0,p.fa.team.length-1)];

  state.session.bfRent={uid:'bfrent',sp:sp,xp:xpFloor(pv.lv),shiny:false,ts:Date.now()};

  state.session.phps.bfrent=maxHpOf(state.session.bfRent); // house property heals between fights

function poiStartFight(kind,f){
  if(!state.game)return;
  if(state.session&&state.session.mode==='boss'){toast('Finish the gym battle first!');return;}
  if(state.session&&state.session.blackout){toast('Your team is out — heal up first!');return;}
  // validate the request against the building's live state
  if(kind==='tower'){var pt=poiOf('tower');poiTowerWeek(pt);if(f!==(pt.floor||0)||f>=8)return;}
  if(kind==='hideout'){var ph=poiOf('hideout');if(f!==(ph.floor||0)||f>=4)return;
    var hq=HIDEOUT_QUESTS[f];
    if(hq&&dailyProg(hq)<hq.target){toast('The way is sealed — finish the floor task first!');return;}}
  if(kind==='silph'){var ps=poiOf('silph');if(f!==(ps.floor||0)||f>=11)return;}
  if(kind==='ghost'){var pg=poiOf('tower2');if(!poiOf('hideout').scope)return;if(f!==(pg.floor||0)||f>=6)return;}
  if(kind==='snorlax'){var pf=poiOf('tower2');if(!pf.flute)return;
    if(state.game.dex.snorlax&&state.game.dex.snorlax.c){toast('SNORLAX is already on your team!');return;}}
  if(kind==='front'){var pfr=poiOf('front');if(f!==(pfr.streak||0))return;}
  /* v6.1 Hoenn kinds — every request is validated against the LIVE story state */
  if(kind==='arc'){
    var vch=Math.floor(f/10),vst=f%10,vcd=ARC_CH[vch-1];
    if(!inHoenn()||!vcd||arcStage()!==vch)return;
    if((poiOf(vcd.key).f||0)!==vst)return;
  }
  if(kind==='pyre'){
    if(!inHoenn()||arcStage()<3||state.game.flags.arc3)return;
    var vpy=poiOf('pyre');if(f!==(vpy.floor||0)||f>=6)return;
  }
  if(kind==='pyrewild'){if(!inHoenn()||!state.game.flags.arc3)return;}
  if(kind==='sky'){
    if(!inHoenn()||arcStage()!==8)return;
    var vsk=poiOf('sky');if(f!==(vsk.floor||0)||f>=5)return;
  }
  if(kind==='legend'){
    if(!inHoenn())return;
    var vlg=HOENN_LEGENDS[f];if(!vlg)return;
    if(!state.game.flags.arc8)return;
    if(state.game.dex[vlg[0]]&&state.game.dex[vlg[0]].c){toast(DEX[vlg[0]].n+' is already with you!');return;}
    if(vlg[0]==='deoxys'&&spaceLaunches()<3)return;
  }
  /* v6.4: SHOAL ice room + POKENAV call — both Hoenn-only */
  if(kind==='shoal'&&!inHoenn())return;
  if(kind==='call'){
    if(!inHoenn())return;
    if(poiOf('nav').d===todayKey()){toast('The NAV is quiet — call answered today!');return;}
  }
  /* v6.2 FRONTIER — every request checked against the facility's live position */
  if(kind&&kind.length===4&&kind.slice(0,2)==='bf'){
    if(!inHoenn()||!bfGate())return;
    var bfp=bfOf(),bfc=kind.slice(2);
    if(bfc==='tw'&&f!==(bfp.tw.streak||0))return;
    if(bfc==='dm'&&f!==(bfp.dm.rd||0))return;
    if(bfc==='pl'&&f!==(bfp.pl.streak||0))return;
    if(bfc==='ar'&&f!==(bfp.ar.streak||0))return;
    if(bfc==='fa'&&(f!==(bfp.fa.streak||0)||!bfp.fa.team))return;
    if(bfc==='pk'){
      if(f!==(bfp.pk.room||0))return;
      var pkq=(f===9&&(bfp.pk.clears===1||bfp.pk.clears===3));
      if(!bfp.pk.pend&&!pkq)return; // fights come from doors — or the QUEEN's chamber
    }
    if(bfc==='py'&&f!==(bfp.py.floor||0))return;
  }
  var w=poiWildFor(kind,f);
  if(!w)return;
  if(state.session){
    state.session.wild=w;
    if(w.tr&&w.tr.fa!==undefined)bfSetupRental();
    state.session.bmsg=w.tr?(w.tr.clsN+' '+w.tr.name+' sent out '+DEX[w.sp].n+'! Log a set to attack!'+(w.tr.moodTxt||'')):poiWildMsg(w);
    save();sfx('battlestart');
    pendingEntrance=w.tr?{enemy:'ball',dly:1450}:{enemy:'wild'};
    tab='workout';render();
    if(w.tr)playVsFx(w.tr.cls,w.tr.clsN+' '+w.tr.name);
    else if(w.shiny)setTimeout(shinyBurst,700);
    setTimeout(function(){cry(w.sp);},400);
  }else{
    pendingPoi={kind:kind,f:f};
    pendingMb=null;
    showChooserThenStart('train');
  }
}

  var tot=0;tbl.forEach(function(e){tot+=e[1];});
  var roll=Math.random()*tot,sp=tbl[0][0];
  for(var i=0;i<tbl.length;i++){roll-=tbl[i][1];if(roll<0){sp=tbl[i][0];break;}}
  var lv=band[0]+Math.floor(Math.random()*(band[1]-band[0]+1));
  var hp=Math.round((500+lv*45)*(0.8+Math.random()*0.4));

  if(!p.lv)p.lv=1;
  var vars=VF_LEVELS[p.lv-1];
  var v=vars[Math.floor(Math.random()*vars.length)];
  var cells=[],open=[],i;
  for(i=0;i<25;i++){cells.push(1);open.push(i);}
  var put=function(val,n){for(var j=0;j<n;j++){var at=open.splice(Math.floor(Math.random()*open.length),1)[0];cells[at]=val;}};
  put(2,v[0]);put(3,v[1]);put(0,v[2]);
  vfB={rg:state.region,lv:p.lv,g:cells,fl:{},mk:{},mode:'flip',cur:0,over:0,won:0};
}
function vfTile(i){
  if(!vfB||vfB.over)return;
  if(vfB.mode==='mark'){vfB.mk[i]=vfB.mk[i]?0:1;render(true);return;}
  if(vfB.fl[i])return;
  var val=vfB.g[i];
  if(val===0){
    var fc=Object.keys(vfB.fl).length;
    vfB.fl[i]=1;vfB.over=1;vfB.won=0;
    var p=poiOf('flip');
    p.lv=Math.max(1,Math.min(vfB.lv,fc));
    save();
    sfx('faint');
    render(true);
    toast('KABOOM! Back to table level '+p.lv+'.');
    return;
  }
  vfB.fl[i]=1;
  vfB.cur=vfB.cur===0?val:vfB.cur*val;
  var done=true;
  for(var j=0;j<25;j++)if(vfB.g[j]>=2&&!vfB.fl[j])done=false;
  if(done){
    vfB.over=1;vfB.won=1;
    var p2=poiOf('flip'),cp=cornerOf();
    cp.coins=(cp.coins||0)+vfB.cur;
    p2.best=Math.max(p2.best||0,vfB.cur);
    p2.lv=Math.min(8,vfB.lv+1);
    save();
    sfx('badge');
    render(true);
    toast('CLEARED! +'+vfB.cur+' coins banked — table level '+p2.lv+'!');
  }else{
    sfx(val>1?'save':'click');
    render(true);
  }
}
function vfHintCell(idx,axis){
  var sum=0,vt=0;
  for(var j=0;j<5;j++){
    var i=(axis==='r')?idx*5+j:j*5+idx;
    sum+=vfB.g[i];
    if(vfB.g[i]===0)vt++;
  }
  return '<div class="vfc vfh" style="border-color:'+VF_COLS[idx]+'"><span class="vfs">'+sum+'</span>'+
    '<span class="vfvn"><img src="sprites/100.png" alt="">'+vt+'</span></div>';
}

function runSlots(){
  if(slotBusy||!state.game)return;
  var p=cornerOf();
  var free=cornerFreeLeft(p);
  if(free>0)p.spins=(p.spins||0)+1;
  else if((p.coins||0)>=10)p.coins-=10;
  else {toast('No coins! Trade ₽ for coins first.');return;}
  // the house decides first, the reels perform after
  var r=Math.random(),win=0,icons;
  if(r<0.05){win=300;var j=SLOT_ICONS[Math.floor(Math.random()*2)+3];icons=[j,j,j];}
  else if(r<0.16){win=120;icons=['pokeball','pokeball','pokeball'];}
  else if(r<0.38){win=30;var pi=SLOT_ICONS[Math.floor(Math.random()*SLOT_ICONS.length)];
    var other=SLOT_ICONS[(SLOT_ICONS.indexOf(pi)+2)%SLOT_ICONS.length];
    icons=[pi,pi,other];}
  else {icons=SLOT_ICONS.slice().sort(function(){return Math.random()-0.5;}).slice(0,3);
    if(icons[0]===icons[1]&&icons[1]===icons[2])icons[2]=SLOT_ICONS[(SLOT_ICONS.indexOf(icons[2])+1)%SLOT_ICONS.length];}
  p.coins=(p.coins||0)+win;
  save();
  slotBusy=true;
  sfx('throw');
  var msg=$('#slotmsg');
  ['A','B','C'].forEach(function(rk){
    var box=document.querySelector('#reel'+rk);
    if(box)box.classList.add('spinning');
  });
  if(msg)msg.textContent='· · ·';
  ['A','B','C'].forEach(function(rk,i){
    setTimeout(function(){
      var box=document.querySelector('#reel'+rk);
      if(box){
        box.classList.remove('spinning');
        box.querySelector('.reelstrip').innerHTML=itemImg(icons[i],34);
      }
      sfx('ballshake');
    },700+i*500);
  });
  setTimeout(function(){
    slotBusy=false;
    if(win>=300)sfx('badge');
    else if(win>0)sfx('save');
    else sfx('weakhit');
    if(msg)msg.textContent=win>0?'WIN! +'+win+' COINS':'No luck…';
    setTimeout(function(){render(true);},900);
  },2050);
}
/* ===== v6.7 MINING WALL: every SET logged today = one pickaxe swing.
   The wall layout is rolled state-first at creation; digging only reveals it.
   Kanto digs at the Pewter museum, Hoenn at Granite Cave — same engine. ===== */
var MINE_W=8,MINE_H=5;
function mineLootTable(){
  var t=[
    [10,{m:400}],[10,{k:'potion'}],[8,{k:'greatball'}],
    [6,{k:'ultraball'}],[6,{m:1200}],[5,{k:'hyperpotion'}],
    [3,{k:'rarecandy'}],[2,{vit:1}],[1,{m:5000}]
  ];
  t.push(inHoenn()?[4,{berry:1}]:[4,{k:'fullrestore'}]);
  return t;
}
function mineNewWall(){
  var open=[],i;
  for(i=0;i<MINE_W*MINE_H;i++)open.push(i);
  var table=mineLootTable(),tw=0,items=[];
  table.forEach(function(e){tw+=e[0];});
  var VITS=['protein','iron','carbos','calcium','hpup'];
  var mtc=4+perkN('prospector'); // v6.9: extra buried treasure
  for(i=0;i<mtc;i++){
    var at=open.splice(Math.floor(Math.random()*open.length),1)[0];
    var roll=Math.random()*tw,pick=null;
    table.forEach(function(e){if(pick===null){roll-=e[0];if(roll<0)pick=e[1];}});
    if(pick===null)pick=table[0][1];
    var it={i:at};
    if(pick.m)it.m=pick.m;
    else if(pick.berry)it.k=BERRY_T1[Math.floor(Math.random()*BERRY_T1.length)];
    else if(pick.vit)it.k=VITS[Math.floor(Math.random()*VITS.length)];
    else it.k=pick.k;
    items.push(it);
  }
  return {c:{},items:items};
}
function mineOf(){
  var p=poiOf('mine');
  if(p.d!==todayKey()){p.d=todayKey();p.u=0;}
  if(!p.wall){p.wall=mineNewWall();save();}
  return p;
}
function mineSwings(){
  if(!state.game)return 0;
  var p=mineOf();
  return Math.max(0,(daySetsMap()[todayKey()]||0)+2*perkN('goldrush')-(p.u||0));
}
function mineNear(p,i){
  var x=i%MINE_W,y=Math.floor(i/MINE_W),out=false;
  p.wall.items.forEach(function(it){
    if(it.g)return;
    var ix=it.i%MINE_W,iy=Math.floor(it.i/MINE_W);
    if(Math.abs(ix-x)<=1&&Math.abs(iy-y)<=1)out=true;
  });
  return out;
}
function mineHTML(){
  var p=mineOf(),sw=mineSwings();
  var found=0;p.wall.items.forEach(function(it){if(it.g)found++;});
  var h='<div class="titlebar"><h1>'+(inHoenn()?'GRANITE DIG SITE':'MUSEUM DIG SITE')+'</h1></div>'+
    '<div class="subtitle">“Every set you lift swings the pickaxe once.”</div>'+
    poiBanner('mine',inHoenn()?'GRANITE CAVE WALL':'PEWTER EXCAVATION');

    '<div class="plv" style="margin-bottom:6px;white-space:normal;line-height:1.3">'+found+'/'+p.wall.items.length+' treasures out. Cleared dirt GLINTS when treasure sleeps beside it. Dig them all and a fresh wall slides in.</div>'+
    '<div class="minegrid">';
  for(var i=0;i<MINE_W*MINE_H;i++){
    if(p.wall.c[i]){
      var got=null;
      p.wall.items.forEach(function(x){if(x.i===i&&x.g)got=x;});
      h+='<div class="minecell dug'+(!got&&mineNear(p,i)?' near':'')+'">'+(got?(got.m?'<span class="mnug">₽</span>':itemImg(got.k,20)):'')+'</div>';
    }else{
      h+='<button class="minecell" data-action="mine-dig" data-i="'+i+'"'+(sw>0?'':' disabled')+'></button>';
    }
  }
  h+='</div>'+(sw<=0?'<div class="plv" style="margin-top:8px;white-space:normal;line-height:1.3">Out of swings — every SET you log today earns one more. The wall keeps its holes overnight.</div>':'')+'</div>';
  h+='<div class="panel"><h3>WHAT’S DOWN THERE</h3><div class="plv" style="white-space:normal;line-height:1.4">Cash nuggets, balls, medicine'+(inHoenn()?', berries':'')+', vitamins — and the odd RARE CANDY. The dig crew never charges: sweat is the entry fee.</div></div>';
  return h+poiBackBtn();
}

function buildTrickQ(i,r){
  var h=strHash(wkKey()+'-t'+i+'-r'+r),L=DEX_ORDER.length;
  function pick(n){return DEX_ORDER[n%L];}
  if(i===0){
    var c=pick(h),o1=pick(h*7+13),o2=pick(h*13+29),n2=1;
    while(o1===c){o1=pick(h*7+13+n2);n2++;}
    while(o2===c||o2===o1){o2=pick(h*13+29+n2);n2++;}
    var opts=[DEX[c].n,DEX[o1].n,DEX[o2].n].sort(function(a,b){return strHash(a+h)-strHash(b+h);});
    return {img:'<img src="'+sprPath(c,false)+'" alt="" class="bigspr" style="filter:brightness(0);opacity:.55">',
      text:'Who’s that POKEMON?',opts:opts,correct:DEX[c].n};
  }
  if(i===1){
    var ALLT=['Fire','Water','Electric','Grass','Ice','Fighting','Rock','Ground','Flying','Psychic','Ghost','Dark','Bug','Poison','Dragon','Steel','Normal'];
    var sp=pick(h*3+5),tries=0;
    var sup=[],weak=[];
    while(tries<40){
      sup=[];weak=[];
      var dt=DEX[sp].t||['Normal'];
      ALLT.forEach(function(at){
        var e=typeEffAgainst(at,dt);
        if(e>=2)sup.push(at);else if(e<2)weak.push(at);
      });
      if(sup.length)break;
      tries++;sp=pick(h*3+5+tries);
    }
    if(!sup.length)sup=['Fighting'];
    var cT=sup[h%sup.length];
    var w1=weak[(h*3)%weak.length],w2=weak[(h*7+2)%weak.length],n3=1;
    while(w2===w1){w2=weak[(h*7+2+n3)%weak.length];n3++;}
    var opts2=[cT,w1,w2].sort(function(a,b){return strHash(a+h)-strHash(b+h);});
    return {img:'<img src="'+sprPath(sp,false)+'" alt="" class="bigspr">',
      text:'Which move type hits '+DEX[sp].n+' ('+(DEX[sp].t||[]).join('/')+') the hardest?',opts:opts2,correct:cT};
  }
  var v,txt;
  if(r===0){v=setsSince(weekStartTs(Date.now()));txt='How many SETS have you logged this week (since Monday)?';}
  else if(r===1){v=Math.round(topLiftSince(Date.now()-30*DAY));txt='Your heaviest single lift of the last 30 days, in '+state.unit+'?';}
  else{v=daysSinceTs(Date.now()-14*DAY);txt='How many days did you train in the last 14 days?';}
  var a1=v+2+(h%5),a2=(v>=3?v-1-(h%2):v+6+(h%3));
  if(a1===v)a1=v+3;
  if(a2===v||a2===a1)a2=v+9;
  var opts3=[String(v),String(a1),String(a2)].sort(function(a,b){return strHash(a+h)-strHash(b+h);});
  return {text:txt,opts:opts3,correct:String(v)};
}

function finishTrick(){
  var ts=trickState;trickState=null;
  var t=TRICKS[ts.i],p=trickOf();
  var passed=ts.score>=t.pass;
  if(p['d'+ts.i]===undefined||ts.score>p['d'+ts.i])p['d'+ts.i]=ts.score;
  var paidNow=false,candyNow=false;
  if(passed&&!p['paid'+ts.i]){
    p['paid'+ts.i]=1;addMoney(400);paidNow=true;
    if(p.paid0&&p.paid1&&p.paid2&&!p.candy){p.candy=1;bagOf().rarecandy=(bagOf().rarecandy||0)+1;candyNow=true;}
  }
  save();
  closeModal();
  queueModal(function(){
    sfx(passed?'badge':'weakhit');
    showModal('<h3 style="text-align:center">'+(passed?'TRICK CLEARED!':'So close…')+'</h3>'+
      '<p style="text-align:center">'+ts.score+' / '+t.rounds+' correct.'+
      (paidNow?' The TRICK MASTER grudgingly pays <b>₽400</b>!':'')+
      (candyNow?'<br>ALL THREE SWEPT — he hurls a <b>RARE CANDY</b> at you!':'')+
      (!passed?'<br>“Fwahaha! Come back when your brain matches your biceps!” (retry any time)':'')+'</p>'+
      '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>');
    modalOk=function(){closeModal();render(true);};
  });
}

/* ===== the ferry ride: a GBA-style map transition between villages ===== */
var travelBusy=false;
function playTravelFx(from,to,firstTime,done){
  if(travelBusy||from===to){done();return;}
  travelBusy=true;
  var old=document.getElementById('travelfx');
  if(old&&old.parentNode)old.parentNode.removeChild(old);
  var x0=TOWN_MAP_XY[from],x1=TOWN_MAP_XY[to];
  var ov=document.createElement('div');ov.id='travelfx';
  if(inHoenn())ov.className='hoenn';
  ov.innerHTML='<div class="tfxcard">'+
      '<div class="tfxtitle">'+TOWNS[from].n+' ▶ '+TOWNS[to].n+'</div>'+
      '<div class="tfxmap"><img src="'+regionMapImg()+'" alt="'+regionName()+'">'+
        '<svg class="tfxsvg" viewBox="0 0 100 100" preserveAspectRatio="none">'+
        '<line x1="'+x0[0]+'" y1="'+x0[1]+'" x2="'+x1[0]+'" y2="'+x1[1]+'" stroke="#D03028" stroke-width="1.4" stroke-dasharray="2.6 2.2" vector-effect="non-scaling-stroke"/></svg>'+
        '<span class="tfxdot" style="left:'+x0[0]+'%;top:'+x0[1]+'%">'+ferryIcon(20)+'</span>'+
      '</div>'+
      '<div class="tfxsign">'+(firstTime?'WELCOME TO<br>':'')+TOWNS[to].n+'</div>'+
    '</div>';
  document.body.appendChild(ov);
  sfx('ferry');
  var dot=ov.querySelector('.tfxdot');
  requestAnimationFrame(function(){requestAnimationFrame(function(){ov.classList.add('on');});});
  setTimeout(function(){ // the ferry chugs across in visible GBA steps
    dot.style.transition='left 1.35s steps(11),top 1.35s steps(11)';
    dot.style.left=x1[0]+'%';dot.style.top=x1[1]+'%';
  },480);
  setTimeout(function(){ov.classList.add('arrive');sfx(firstTime?'badge':'save');},2050);
  setTimeout(function(){ov.classList.add('out');},2820);
  setTimeout(function(){
    if(ov.parentNode)ov.parentNode.removeChild(ov);
    travelBusy=false;
    done();
  },3220);
}
