/* ===== game: sound ===== */
function ac(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){return null;}
  return audioCtx;
}
function tone(t0,freq,dur,type,vol,endFreq){
  var c=audioCtx;if(!c)return;
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(freq,t0);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.05,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(c.destination);
  o.start(t0);o.stop(t0+dur+0.03);
}
/* species-id → cry key resolver (boss-only mons included) */
var SP_BY_ID=null;
var EXTRA_CRIES={87:'dewgong',114:'tangela',124:'jynx'};
function spById(id){
  if(!SP_BY_ID){
    SP_BY_ID={};
    Object.keys(DEX).forEach(function(k){if(SP_BY_ID[DEX[k].id]===undefined)SP_BY_ID[DEX[k].id]=k;});
  }
  return SP_BY_ID[id]||EXTRA_CRIES[id];
}
/* official Showdown cries (bundled) + authentic FRLG move SFX (khinsider, trimmed) */
var CRIES_ON=true;
var sndBufs={};
function playBuf(buf,gain,maxSec){
  var c=ac();if(!c)return;
  try{
    var src=c.createBufferSource(),g=c.createGain();
    g.gain.value=gain||0.25;
    src.buffer=buf;src.connect(g);g.connect(c.destination);
    src.start();
    if(maxSec)src.stop(c.currentTime+maxSec);
  }catch(e){}
}
/* generic lazy loader: fetch → decode → cache buffer (or 'x' on miss), then play */
function playSnd(url,key,gain,maxSec){
  if(state.sound===false)return;
  var c=ac();if(!c)return;
  if(sndBufs[key]){if(sndBufs[key]!=='x')playBuf(sndBufs[key],gain,maxSec);return;}
  fetch(url)
    .then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();})
    .then(function(b){return new Promise(function(res,rej){c.decodeAudioData(b,res,rej);});})
    .then(function(buf){sndBufs[key]=buf;playBuf(buf,gain,maxSec);})
    .catch(function(){sndBufs[key]='x';});
}
function cry(sp){
  if(!CRIES_ON||!sp)return;
  playSnd('sounds/cries/'+sp+'.mp3','cry_'+sp,0.22);
}
function cryById(id){cry(spById(id));}
function moveSlug(name){return String(name||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function moveSfx(name){
  var sg=moveSlug(name);if(!sg)return;
  playSnd('sounds/moves/'+sg+'.mp3','mv_'+sg,0.5,1.5);
}
/* v6.3.1: the REAL Gen-3 menu blip (SE_SELECT), rendered from the official
   sequence data (pret/pokeemerald sound/songs/midi/se_select.mid, voicegroup
   rs_sfx_1 voices 87/88): 50%-duty square, A#6 for 25ms then G7 for 125ms,
   velocity trembling 68/127/68/127/68, +0.4st bend, instant attack, fast release.
   The GBA synthesizes this from the same data at runtime — no recording exists. */
function seSelect(t0){
  var c=audioCtx;if(!c)return;
  var o=c.createOscillator(),g=c.createGain(),V=0.05;
  o.type='square';
  o.frequency.setValueAtTime(1909,t0);
  o.frequency.setValueAtTime(3211,t0+0.025);
  g.gain.setValueAtTime(V*0.54,t0);
  g.gain.setValueAtTime(V,t0+0.025);
  g.gain.setValueAtTime(V*0.54,t0+0.05);
  g.gain.setValueAtTime(V,t0+0.075);
  g.gain.setValueAtTime(V*0.54,t0+0.1);
  g.gain.setValueAtTime(V*0.54,t0+0.15);
  g.gain.linearRampToValueAtTime(0.0001,t0+0.158);
  o.connect(g);g.connect(c.destination);
  o.start(t0);o.stop(t0+0.17);
}

      '<button class="step" data-action="step" data-t="w" data-d="-1">−</button>'+
      '<input id="in-w" type="text" inputmode="decimal" value="'+fmtW(w)+'" aria-label="Weight">'+
      '<button class="step" data-action="step" data-t="w" data-d="1">＋</button></div>'+
    '<div class="steprow"><label>Reps</label>'+

function histListHTML(id){
  // only the previous training for this exercise — the full log lives in HISTORY
  var logs=logsOf(id).slice().sort(function(a,b){return b.ts-a.ts;});
  if(state.session)logs=logs.filter(function(l){return l.ts<state.session.start;});
  if(!logs.length)return '<div class="chart-empty" style="padding-bottom:30px">No history yet — your sets will show up here.</div>';
  var lastKey=dateKey(logs[0].ts);
  var h='<div class="histday">LAST TRAINING · '+fmtDayKey(lastKey)+'</div>';
  logs.forEach(function(l){
    if(dateKey(l.ts)!==lastKey)return;
    h+='<div class="hrow"><div class="meta"><div class="hname">'+fmtW(l.w)+' '+state.unit+
      ' <span class="hsub" style="font-size:13px">× '+l.r+(l.s>1?' × '+l.s+' sets':'')+'</span></div></div>'+
      '<div class="hsub">'+fmtTime(l.ts)+'</div>'+
      '<button class="delbtn" data-action="del-log" data-log="'+l.id+'" aria-label="Delete entry">✕</button></div>';
  });
  return h;
}

function updateBest(id){
  var el=$('#sh-best'); if(!el)return;
  var b=bestW(id);
  el.textContent=b>0?('BEST '+fmtW(b)+state.unit):'';
}

/* ===== chart ===== */
function chartHTML(id){
  var pts=dayTops(id).slice(-12);
  if(pts.length<2)return '<div class="chart-empty">Log on two different days and your progress curve appears here 📈</div>';
  var W=336,H=150,L=34,R=12,T=20,B=22;
  var ws=pts.map(function(p){return p.w;});
  var omin=Math.min.apply(null,ws), omax=Math.max.apply(null,ws);
  var lo,hi;
  if(omin===omax){lo=omin-2;hi=omax+2;}else{var pad=(omax-omin)*0.18;lo=omin-pad;hi=omax+pad;}
  function X(i){return L+(W-L-R)*i/(pts.length-1);}
  function Y(w){return T+(H-T-B)*(1-(w-lo)/(hi-lo));}
  var line='', area='M '+X(0).toFixed(1)+' '+(H-B)+' ';
  pts.forEach(function(p,i){
    var x=X(i).toFixed(1), y=Y(p.w).toFixed(1);
    line+=(i?' ':'')+x+','+y;
    area+='L '+x+' '+y+' ';
  });
  area+='L '+X(pts.length-1).toFixed(1)+' '+(H-B)+' Z';
  var dots=pts.map(function(p,i){
    var last=i===pts.length-1;
    return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.w).toFixed(1)+'" r="'+(last?4.5:3)+'" fill="'+(last?'#D03028':'var(--accent)')+'"/>';
  }).join('');
  var lastP=pts[pts.length-1];
  var grid='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(omax).toFixed(1)+'" y2="'+Y(omax).toFixed(1)+'" stroke="rgba(255,255,255,.08)" stroke-dasharray="3 4"/>';
  if(omax!==omin)grid+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(omin).toFixed(1)+'" y2="'+Y(omin).toFixed(1)+'" stroke="rgba(255,255,255,.08)" stroke-dasharray="3 4"/>';
  var labels='<text x="2" y="'+(Y(omax)+4).toFixed(1)+'" class="cl">'+fmtW(omax)+'</text>';
  if(omax!==omin)labels+='<text x="2" y="'+(Y(omin)+4).toFixed(1)+'" class="cl">'+fmtW(omin)+'</text>';
  labels+='<text x="'+X(pts.length-1).toFixed(1)+'" y="'+(Y(lastP.w)-10).toFixed(1)+'" text-anchor="end" class="cl big">'+fmtW(lastP.w)+'</text>';
  var p0=pts[0].k.split('-'), p1=lastP.k.split('-');
  labels+='<text x="'+L+'" y="'+(H-4)+'" class="cl">'+MONTHS[+p0[1]-1]+' '+(+p0[2])+'</text>'+
    '<text x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end" class="cl">'+MONTHS[+p1[1]-1]+' '+(+p1[2])+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" aria-hidden="true">'+
    '<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="var(--accent)" stop-opacity=".30"/>'+
    '<stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>'+
    grid+'<path d="'+area+'" fill="url(#cg)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+labels+'</svg>';
}

/* ===== logging ===== */
function stepInput(t,d){
  var inp=$('#in-'+t); if(!inp)return;
  var v=parseFloat((inp.value||'').replace(',','.'));
  if(isNaN(v))v=(t==='w')?20:(t==='r'?10:1);
  var st=(t==='w')?(state.unit==='kg'?2.5:5):1;
  v=v+d*st;
  v=Math.max(t==='w'?0:1,Math.round(v*100)/100);
  inp.value=fmtW(v);
}
function refreshSheetData(id){
  if(sheetEx===id){
    var sh=$('#sh-hist'), sc=$('#sh-chart'), st=$('#sh-today');
    if(sh)sh.innerHTML=histListHTML(id);
    if(sc)sc.innerHTML=chartHTML(id);
    if(st)st.innerHTML=todayRowsHTML(id);
    updateBest(id);
    updateBattlePanel();
  }else{
    render(true);
  }
}
function saveLogEntry(){
  var id=sheetEx; if(!id)return;
  var w=parseFloat(($('#in-w').value||'').replace(',','.'));
  var r=Math.max(1,parseInt($('#in-r').value,10)||0);
  var s=Math.max(1,parseInt($('#in-s').value,10)||0);
  if(!(w>0)){toast('Enter a weight first');$('#in-w').focus();return;}
  var prevBest=bestW(id);
  var entry={id:uid(),ts:Date.now(),w:Math.round(w*100)/100,r:r,s:s};
  if(state.game){
    var am=activeMon();
    pendingLvCapture=[]; // v6.3: the fighter's level-ups play inside the battle for this set
    if(am){
      /* v6.7 EFFORT SCALING: battle power = how close the set comes to YOUR best
         on this exercise × the benchmark bar (powerBase). Every lift can hit full
         force; beating your record overdrives up to 125%. ≥95% = guaranteed crit. */
      var rel=prevBest>0?Math.min(1.25+0.15*perkN('overdrive'),entry.w/prevBest):1;
      entry.rel=Math.round(rel*100)/100;
      var vol=rel*powerBase()*entry.r*entry.s;
      var expFrom=expPctOf(am),expLv0=monLevel(am.xp);
      var gain=Math.round(vol/10*(state.session?(state.session.mode==='boss'?1:1.5):1)*(state.session&&state.session.lucky?2:1)*(heldOf(am)==='machobrace'?1.25:1)*(1+0.08*perkN('scholar')));
      if(gain>0){
        entry.xpg=gain;entry.mon=am.uid;
        if(state.session)state.session.xpg=(state.session.xpg||0)+gain;
        applyXP(am,gain);
        perkAddXp(gain); // v6.9: YOUR bar fills with the same effort-scaled XP
        /* v6.9 CANDY MAKER: every 25 logged sets bakes free RARE CANDY */
        if(perkN('candymaker')){
          var pkc=perksOf();
          pkc.cd=(pkc.cd||0)+entry.s;
          while(pkc.cd>=25){
            pkc.cd-=25;
            bagOf().rarecandy=(bagOf().rarecandy||0)+perkN('candymaker');
            toast('CANDY MAKER: +'+perkN('candymaker')+' RARE CANDY!');
          }
        }
        // the EXP SHARE holder rides along at half rate
        var esh=expShareHolder(am.uid);
        if(esh){
          var eshG=Math.max(1,Math.round(gain*eshRate()));
          if(state.session)state.session.xpg=(state.session.xpg||0)+eshG;
          applyXP(esh,eshG);
        }
      }
      if(state.session&&state.session.mode==='boss'&&state.game.boss){
        resolveBossSet(am,entry,vol,id);
      }
      else if(state.session&&state.session.mode==='train'&&state.session.wild&&state.session.blackout){
        state.session.bmsg=DEX[am.sp].n+' keeps training! +'+(entry.xpg||0)+' XP. (Blacked out — no battles this workout.)';
        pendingSteps={ov:null,list:[{msg:state.session.bmsg}]};
      }
      else if(state.session&&state.session.mode==='train'&&state.session.wild&&state.session.wild.safari){
        // SAFARI ZONE: sets can't hurt the wild — they're ROCK/BAIT steps
        var sfw=state.session.wild,sfSteps=[],oldSN=DEX[sfw.sp].n;
        var heavyW=state.unit==='lb'?132:60;
        if(entry.w>=heavyW){sfw.rock=1;sfw.bait=0;}
        else if(entry.r>=15){sfw.bait=1;sfw.rock=0;}
        var fleeP=sfw.rock?0.4:(sfw.bait?0.1:0.25);
        if(Math.random()<fleeP){
          state.session.wild=spawnWild();
          var newSN=DEX[state.session.wild.sp].n;
          state.session.bmsg='The wild '+oldSN+' fled! A wild '+newSN+' appeared!';
          sfSteps.push({msg:'The wild '+oldSN+' fled!',sfx:'faint',faint:'enemy',hold:1000});
          sfSteps.push({msg:'A wild '+newSN+' appeared!',sfx:'battlestart',cry:state.session.wild.sp,refresh:true,slide:'enemy'});
        }else{
          var actMsg=sfw.rock?'A ROCK-heavy set! The '+oldSN+' looks easier to catch — but twitchy…'
            :(sfw.bait?'A BAIT-style burner! The '+oldSN+' settles in, watching you…'
              :'The wild '+oldSN+' is watching carefully…');
          state.session.bmsg=actMsg+' THROW BALL when ready!';
          sfSteps.push({msg:actMsg,sfx:sfw.rock?'hit':'save'});
          sfSteps.push({refresh:true,hold:0});
        }
        pendingSteps={ov:null,list:sfSteps};
      }
      else if(state.session&&state.session.mode==='train'&&state.session.wild){
        if(!state.session.party)initBossSession();
        var wd=state.session.wild;
        /* FACTORY (v6.2): the rental fights in your mon's place */
        var fm=(wd.tr&&wd.tr.fa!==undefined&&state.session.bfRent)?state.session.bfRent:am;
        var stT=statsFor(fm);
        var wKm=knownMoves(fm);
        var wMv=wKm[Math.floor(Math.random()*wKm.length)];
        var wCrit=(entry.rel>=pfT())||Math.random()<Math.min(0.25,stT.spe/400)+heldCritBonus(fm)+0.04*perkN('keeneye');
        var dmgT=Math.round(vol*(1+Math.max(stT.atk,stT.spa)/250)*(wCrit?(1.5+0.15*perkN('sharplens')):1)*heldBoostFor(fm,moveTypeOf(wMv))*(wd.tr&&wd.tr.mood?wd.tr.mood:1)*(1+0.06*perkN('powerbrace'))*(wd.tr&&wd.tr.brain?(1+0.2*perkN('titanslayer')):1));
        var wPre={sp:wd.sp,lv:wd.lv,hp:Math.max(0,wd.hp),max:wd.max,shiny:wd.shiny,tr:wd.tr};
        var wFrom=Math.round(wPre.hp/wd.max*100);
        wd.parts=wd.parts||{};wd.parts[fm.uid]=1; // everyone who lands a hit shares the EXP
        wd.hp-=dmgT;
        /* BATTLE ARENA (v6.2): three sets on the clock, then the judges rule */
        var judgeLoss=false;
        if(wd.tr&&wd.tr.judge&&wd.hp>0){
          wd.jd=(wd.jd||0)+1;
          if(wd.jd>=3){
            if(wd.hp<=wd.max*0.5){wd.hp=0;wd.tr.jwin=1;}
            else judgeLoss=true;
          }
        }
        var wTo=Math.round(Math.max(0,wd.hp)/wd.max*100);
        var wAtk=DEX[fm.sp].n+' used '+wMv+'!'+(wCrit?((entry.rel>=pfT())?' PERFECT FORM — critical hit!':' A critical hit!'):'');
        var wSteps=[{msg:wAtk,sfx:wCrit?'superhit':'hit',movesfx:wMv,lunge:'player',blink:'enemy',ehp:[wFrom,wTo],dmg:['enemy',dmgT],fx:moveTypeOf(wMv)}];
        if(judgeLoss){
          var arp=bfOf();
          if(arp.ar.streak)toast('The ARENA streak of '+arp.ar.streak+' ends…');
          arp.ar.streak=0;
          var jN=wd.tr.clsN+' '+wd.tr.name;
          state.session.wild=spawnWild();
          var jnew=DEX[state.session.wild.sp].n;
          state.session.bmsg='The judges raise '+jN+'’s hand — the ARENA match is lost. Back to training: a wild '+jnew+' appeared!';
          wSteps.push({msg:'The 3-set clock runs out… the JUDGES rule against you!',sfx:'faint',hold:1500});
          wSteps.push({msg:'Back to normal training! A wild '+jnew+' appeared!',sfx:'battlestart',cry:state.session.wild.sp,refresh:true,slide:'enemy'});
        }
        else if(wd.hp<=0){
          // classic EXP: base yield × level / 7, ×1.5 for trainer mons, ×2 Lucky Egg,
          // split among every party member that took part in the fight
          var wParts=Object.keys(wd.parts||{}).filter(function(u){return !!findMon(u);});
          if(!wParts.length)wParts=[am.uid];
          resBump(wd.sp,'f');resBump(fm.sp,'v'); // v6.7: field research tallies
          var wGain=Math.round(expYieldOf(DEX[wd.sp].id)*wd.lv/7*(wd.tr?1.5:1)*(state.session.lucky?2:1));
          var wShare=Math.max(1,Math.round(wGain/wParts.length));
          wParts.forEach(function(u){var pm=findMon(u);if(pm)applyXP(pm,wShare);});
          var wbonus=wShare*wParts.length;
          var eshW=expShareHolder(null);
          if(eshW&&wParts.indexOf(eshW.uid)<0){
            var eshWS=Math.max(1,Math.round(wShare*eshRate()));
            applyXP(eshW,eshWS);
            wbonus+=eshWS;
          }
          state.session.xpg=(state.session.xpg||0)+wbonus;
          var splitLab=wParts.length>1?' split '+wParts.length+' ways':'';
          var oldN=DEX[wd.sp].n;
          state.session.wild=spawnWild();
          var newN=DEX[state.session.wild.sp].n;
          if(wd.tr){
            // trainer beaten — payout, like the games (AMULET COIN pays half again)
            if(partyHolds('amuletcoin'))wd.tr.purse=Math.round(wd.tr.purse*1.5);
            if(perkN('bounty'))wd.tr.purse=Math.round(wd.tr.purse*(1+0.10*perkN('bounty'))); // v6.8
            addMoney(wd.tr.purse);
            var isRival=!!wd.tr.rival;
            var mbWin=(wd.tr.mb!==undefined&&state.game.road)?(isRival?' RIVAL DEFEATED!':' ROADBLOCK CLEARED!'):'';
            if(wd.tr.mb!==undefined&&state.game.road)state.game.road.mb[wd.tr.mb]=1;
            mbWin+=poiTrainerWin(wd.tr); // building floors advance here (tower/hideout/silph)
            state.session.bmsg=wd.tr.clsN+' '+wd.tr.name+' was defeated!'+mbWin+' Won ₽'+wd.tr.purse+'! Back to normal training — a wild '+newN+' appeared!';
            wSteps.push({msg:'Foe '+oldN+' is unable to battle! +'+wbonus+' EXP'+splitLab+'!',sfx:'faint',cry:wPre.sp,faint:'enemy',hold:1100});
            wSteps.push({msg:wd.tr.clsN+' '+wd.tr.name+' was defeated!'+mbWin+' Won ₽'+wd.tr.purse+'!',sfx:'badge',hold:1500});
            wSteps.push({msg:'Back to normal training! A wild '+newN+' appeared!',sfx:'battlestart',cry:state.session.wild.sp,refresh:true,slide:'enemy'});
            trainerVictoryModal(wd.tr,wPre.sp,wbonus,isRival,newN);
          }else{
            // every tired-out wild counts toward the road + daily quests
            if(state.game.road)state.game.road.kills=(state.game.road.kills||0)+1;
            dailyBumpKill();
            var ghostWin='';
            if(wd.pyre!==undefined){
              var pp2=poiOf('pyre');
              if((pp2.floor||0)===wd.pyre){
                pp2.floor=(pp2.floor||0)+1;
                ghostWin=' The spirit rests — MT. PYRE '+(wd.pyre+1)+'F cleared!';
              }
            }
            if(wd.sky!==undefined){
              var ps2=poiOf('sky');
              if((ps2.floor||0)===wd.sky){
                ps2.floor=(ps2.floor||0)+1;
                ghostWin=' The stair opens — SKY PILLAR '+(wd.sky+1)+'F cleared!';
              }
            }
            if(wd.legend)ghostWin=' It vanished into the horizon… it will return to the same spot.';
            if(perkN('tipjar')){var tjp=15*perkN('tipjar');addMoney(tjp);ghostWin+=' Picked up ₽'+tjp+'!';} // v6.9
            if(wd.ghost!==undefined){
              var pg2=poiOf('tower2');
              if((pg2.floor||0)===wd.ghost){
                pg2.floor=(pg2.floor||0)+1;
                ghostWin=' The spirit rests — TOWER '+(wd.ghost+1)+'F cleared!';
                if(wd.ghost===5&&!pg2.cubone){
                  pg2.cubone=1;
                  var cshiny=Math.random()<0.05;
                  var cbm=addMon('cubone',cshiny);cbm.xp=xpFloor(25);
                  queueModal(function(){
                    sfx('catch');cry('cubone');
                    showModal('<h3>The tower is quiet…</h3><p>The MAROWAK ghost was finally calmed. Its orphaned CUBONE :L25 clings to you!'+(cshiny?' ✨ It’s SHINY!':'')+'</p>'+
                      '<div style="text-align:center;padding:8px 0"><img class="bigspr'+(cshiny?' shinyglow':'')+'" src="'+sprPath('cubone',cshiny)+'" alt=""></div>'+
                      '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>');
                    modalOk=function(){closeModal();render(true);};
                  });
                }
              }
            }
            state.session.bmsg='Wild '+oldN+' fainted! +'+wbonus+' EXP!'+ghostWin+' A wild '+newN+' appeared!';
            wSteps.push({msg:'Wild '+oldN+' fainted! +'+wbonus+' EXP'+splitLab+'!'+ghostWin,sfx:'faint',cry:wPre.sp,faint:'enemy',hold:1100});
            wSteps.push({msg:'A wild '+newN+' appeared!',sfx:'battlestart',cry:state.session.wild.sp,refresh:true,slide:'enemy'});
          }
        }else{
          state.session.bmsg=wAtk+' '+dmgT.toLocaleString()+' dmg.'+(wd.tr&&wd.tr.judge?' ('+(3-(wd.jd||0))+' set'+((3-(wd.jd||0))===1?'':'s')+' on the clock!)':'');
          var wct=applyWildCounter(wd,fm);
          wSteps.push({msg:wct.msg,sfx:'hit',lunge:'enemy',blink:'player',php:wct.php,dmg:['player',wct.dmg],quake:true});
          if(wct.fainted){
            wSteps.push({msg:wct.faintMsg,sfx:'faint',cry:fm.sp,faint:'player',hold:1100});
            if(wct.goMsg)wSteps.push({msg:wct.goMsg,sfx:'battlestart',cry:(findMon(state.session.lead)||{}).sp,refresh:true,slide:'player'});
            else wSteps.push({msg:'Your whole team fainted! You blacked out…',refresh:true,hold:1400});
          }else{
            wSteps.push({refresh:true,hold:0});
          }
        }
        insertBeforeRefresh(wSteps,leftoversStep(fm));
        insertBeforeRefresh(wSteps,shellBellStep(fm,dmgT));
        insertBeforeRefresh(wSteps,perkWindStep(fm)); // v6.8 SECOND WIND
        pendingSteps={ov:{wild:wPre,lead:fm},list:wSteps};
      }
      // a new record feeds the lead a Rare Candy: jump to the next level (+PR bonus ₽)
      if(entry.w>prevBest&&prevBest>0){
        sfx('pr');
        addMoney(300);
        var clv=monLevel(am.xp);
        if(clv<100&&am.xp<xpFloor(clv+1)){
          am.xp=xpFloor(clv+1);
          queueLevelUp(am,clv,clv+1);
        }
      }
      else if(!(state.session&&state.game)){sfx('save');}
      // hand the XP fill to the battle playback (wraps through 100 on level-up)
      if(pendingSteps)pendingSteps.exp={from:expFrom,to:expPctOf(am),wrap:monLevel(am.xp)>expLv0};
      // v6.3: the captured level-up joins the battle steps (flash + stat sheet)
      if(pendingLvCapture&&pendingLvCapture.length){
        var lvfx=pendingLvCapture[pendingLvCapture.length-1];
        if(pendingSteps)pendingSteps.list.push({msg:lvfx.n+' grew to :L'+lvfx.to+'!',sfx:'levelup',levelup:lvfx,hold:2400});
        else toast(lvfx.n+' grew to :L'+lvfx.to+'!');
      }
      pendingLvCapture=null;
      if(state.game.egg){
        state.game.egg.left-=Math.round(entry.s*(1+0.25*perkN('warmnest')));
        if(state.game.egg.left<=0){
          var HATCH=inHoenn()?HOENN_EGG_POOL:KANTO_EGG_POOL;
          var hsp=HATCH[Math.floor(Math.random()*HATCH.length)];
          var hshiny=Math.random()<0.2;
          state.game.egg=null;
          addMon(hsp,hshiny);
          /* v6.5: the egg gets a real hatching — wobble, white burst, newborn reveal */
          queueModal(function(){
            fxHold=true;
            playHatchFx(hsp,hshiny);
            setTimeout(function(){
              fxHold=false;

function delLogEntry(logId){
  var id=sheetEx; if(!id)return;
  var arr=state.logs[id]||[];
  var i=arr.findIndex(function(l){return l.id===logId;});
  if(i<0)return;
  var gone=arr.splice(i,1)[0];
  if(!arr.length)delete state.logs[id];
  if(gone.xpg&&gone.mon&&state.game){
    var dm=findMon(gone.mon);
    if(dm)dm.xp=Math.max(0,dm.xp-gone.xpg);
    if(state.session&&state.session.xpg)state.session.xpg=Math.max(0,state.session.xpg-gone.xpg);
  }
  if(gone.dmg!==undefined&&state.game&&state.game.boss&&state.game.boss.idx===gone.bidx){
    state.game.boss.hp=Math.min(hpFor(gone.bidx,state.game.round||1),state.game.boss.hp+gone.dmg);
  }
  save();
  refreshSheetData(id);
  toast('Entry deleted',{action:'Undo',fn:function(){
    (state.logs[id]=state.logs[id]||[]).push(gone);
    state.logs[id].sort(function(a,b){return a.ts-b.ts;});
    if(gone.xpg&&gone.mon&&state.game){
      var um=findMon(gone.mon);
      if(um)um.xp+=gone.xpg;
      if(state.session)state.session.xpg=(state.session.xpg||0)+gone.xpg;
    }
    if(gone.dmg!==undefined&&state.game&&state.game.boss&&state.game.boss.idx===gone.bidx){
      state.game.boss.hp=Math.max(1,state.game.boss.hp-gone.dmg);
    }
    save();
    refreshSheetData(id);
  }});
}

/* ===== rest timer ===== */
var timerInt=null, timerEnd=0, timerBtnEl=null, timerLbl='', audioCtx=null;
function stopTimer(){
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  if(timerBtnEl){timerBtnEl.classList.remove('on');timerBtnEl.textContent=timerLbl;timerBtnEl=null;}
}
function startTimer(sec,btn){
  if(timerBtnEl===btn){stopTimer();return;}
  stopTimer();
  timerBtnEl=btn; timerLbl=btn.textContent;
  timerEnd=Date.now()+sec*1000;
  btn.classList.add('on');
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
  function tick(){
    var left=Math.ceil((timerEnd-Date.now())/1000);
    if(left<=0){
      stopTimer();
      toast('Rest over — next set 💪');
      beep();
      if(navigator.vibrate)navigator.vibrate(200);
      return;
    }
    if(timerBtnEl)timerBtnEl.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  }
  tick();
  timerInt=setInterval(tick,250);
}
function beep(){
  try{
    if(!audioCtx)return;
    var t0=audioCtx.currentTime;
    [0,0.22].forEach(function(off){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.001,t0+off);
      g.gain.exponentialRampToValueAtTime(0.25,t0+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t0+off+0.18);
      o.start(t0+off);o.stop(t0+off+0.2);
    });
  }catch(e){}
}

/* ===== toast ===== */
var toastTimer=null;
function toast(msg,opts){
  opts=opts||{};
  var t=$('#toast');
  t.innerHTML=esc(msg)+(opts.action?' <button id="toastact">'+esc(opts.action)+'</button>':'');
  if(opts.action)$('#toastact').onclick=function(){opts.fn();t.classList.remove('show');};
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},opts.action?4500:1800);
}

  };});
  var nl={};

      .map(function(l){return {id:l.id||uid(),ts:+l.ts,w:+l.w,r:Math.max(1,parseInt(l.r,10)||1),s:Math.max(1,parseInt(l.s,10)||1)};})

      exercises:Math.max(0,parseInt(s.exercises,10)||0)};})
    .sort(function(a,b){return a.start-b.start;}):[];

        if(bsrc.fa){
          bfo.fa={streak:pin(bsrc.fa.streak,999),best:pin(bsrc.fa.best,999),lead:pin(bsrc.fa.lead,2),team:null};
          if(Array.isArray(bsrc.fa.team)){
            var ft=bsrc.fa.team.filter(function(sp){return DEX[sp];}).slice(0,3);
            if(ft.length===3)bfo.fa.team=ft;
          }
        }
        if(bsrc.pk)bfo.pk={room:pin(bsrc.pk.room,9),clears:pin(bsrc.pk.clears,9999),pend:pin(bsrc.pk.pend,2)};
        if(bsrc.py)bfo.py={floor:pin(bsrc.py.floor,6),clears:pin(bsrc.py.clears,9999)};
        bfo.sym={};
        if(bsrc.sym)['tw','dm','pl','ar','fa','pk','py'].forEach(function(sk){
          var sv=pin(bsrc.sym[sk],2);
          if(sv)bfo.sym[sk]=sv;
        });
        gm.poi.bf=bfo;
      }
    }
    /* v6.3: the SECRET BASE — spot index + up to 12 validated decorations (Hoenn only) */
    gm.base=null;
    if(hoR&&dgame.base&&isFinite(dgame.base.spot)&&BASE_SPOTS[+dgame.base.spot]){
      gm.base={spot:+dgame.base.spot,deco:{}};
      if(dgame.base.deco&&typeof dgame.base.deco==='object'){
        for(var bdi=0;bdi<12;bdi++){
          var bdv=dgame.base.deco[bdi];
          if(!bdv)continue;
          if(bdv.t==='doll'&&DEX[bdv.sp])gm.base.deco[bdi]={t:'doll',sp:bdv.sp};
          else if(bdv.t==='tr'){
            var bok=false;BASE_TROPHIES.forEach(function(x){if(x.k===bdv.k)bok=true;});
            if(bok)gm.base.deco[bdi]={t:'tr',k:bdv.k};
          }
        }
      }
    }
    /* v6.7: FIELD RESEARCH counters — per-species, validated */
    gm.res={};
    if(dgame.res&&typeof dgame.res==='object'){
      Object.keys(dgame.res).forEach(function(rsp3){
        if(!DEX[rsp3])return;
        var rv=dgame.res[rsp3],ro={};
        if(rv&&typeof rv==='object'){
          ['c','f','v'].forEach(function(rk3){
            var rn=parseInt(rv[rk3],10);
            if(rn>0)ro[rk3]=Math.min(9999,rn);
          });
          if(rv.rw)ro.rw=1;
        }
        if(Object.keys(ro).length)gm.res[rsp3]=ro;
      });
    }
    /* v6.8: TRAINER CARDS — picks spent, taken stacks (cap-clamped), the saved offer */
    gm.perks={used:0,taken:{},offer:null,annLv:1};
    if(dgame.perks&&typeof dgame.perks==='object'){
      var pks=dgame.perks;
      gm.perks.used=Math.max(0,parseInt(pks.used,10)||0);
      gm.perks.annLv=Math.max(1,parseInt(pks.annLv,10)||1);
      gm.perks.xp=Math.max(0,Math.round(+pks.xp)||0);   /* v6.9 hero XP */
      gm.perks.cd=Math.max(0,parseInt(pks.cd,10)||0);   /* candy-maker set count */
      if(pks.taken&&typeof pks.taken==='object')Object.keys(pks.taken).forEach(function(tk2){
        var pdf=perkDef(tk2);
        if(!pdf)return;
        var tn=parseInt(pks.taken[tk2],10);
        if(tn>0)gm.perks.taken[tk2]=Math.min(pdf.cap,tn);
      });
      if(Array.isArray(pks.offer)){
        var ofr=pks.offer.filter(function(ok2){return !!perkDef(ok2);}).slice(0,3);
        if(ofr.length)gm.perks.offer=ofr;
      }
    }
    gm.bp=Math.max(0,Math.round(+dgame.bp)||0);
    gm.bestStreak=Math.max(0,parseInt(dgame.bestStreak,10)||0);
    gm.visit=(isFinite(dgame.visit)&&+dgame.visit>=0&&+dgame.visit<R_TOWNS.length)?+dgame.visit:null;
    gm.beenTo={};
    if(dgame.beenTo&&typeof dgame.beenTo==='object'){
      Object.keys(dgame.beenTo).forEach(function(bk2){
        var bi2=parseInt(bk2,10);
        if(bi2>=0&&bi2<R_TOWNS.length&&dgame.beenTo[bk2])gm.beenTo[bi2]=1;
      });
    }
    gm.road=null;
    if(dgame.road&&isFinite(dgame.road.idx)){
      gm.road={idx:Math.max(0,parseInt(dgame.road.idx,10)||0),
        round:Math.max(1,parseInt(dgame.road.round,10)||1),
        startTs:+dgame.road.startTs||Date.now(),
        kills:Math.max(0,parseInt(dgame.road.kills,10)||0),mb:{},qdone:{}};
      if(dgame.road.mb&&typeof dgame.road.mb==='object')Object.keys(dgame.road.mb).forEach(function(mk){if(dgame.road.mb[mk])gm.road.mb[mk]=1;});
      if(dgame.road.qdone&&typeof dgame.road.qdone==='object')Object.keys(dgame.road.qdone).forEach(function(qk){if(dgame.road.qdone[qk])gm.road.qdone[qk]=1;});
      if(dgame.road.qann&&typeof dgame.road.qann==='object'){gm.road.qann={};Object.keys(dgame.road.qann).forEach(function(ak){if(dgame.road.qann[ak])gm.road.qann[ak]=1;});}
      if(dgame.road.clearmsg)gm.road.clearmsg=1;
    }
    gm.daily=null;
    if(dgame.daily&&typeof dgame.daily==='object'&&typeof dgame.daily.date==='string'){
      gm.daily={date:dgame.daily.date,claimed:{},kills:Math.max(0,parseInt(dgame.daily.kills,10)||0),
        streak:Math.max(0,parseInt(dgame.daily.streak,10)||0),
        lastDone:typeof dgame.daily.lastDone==='string'?dgame.daily.lastDone:null};
      if(dgame.daily.claimed&&typeof dgame.daily.claimed==='object')Object.keys(dgame.daily.claimed).forEach(function(ck){if(dgame.daily.claimed[ck])gm.daily.claimed[ck]=1;});
    }
    gm.npcq=null;
    if(dgame.npcq&&isFinite(dgame.npcq.startTs)){
      gm.npcq={startTs:+dgame.npcq.startTs,claimed:{},st:{}};
      if(dgame.npcq.st&&typeof dgame.npcq.st==='object'){
        R_NPCQ.forEach(function(q){var sv=+dgame.npcq.st[q.k];if(isFinite(sv)&&sv>0)gm.npcq.st[q.k]=sv;});
      }
      if(dgame.npcq.claimed&&typeof dgame.npcq.claimed==='object'){
        R_NPCQ.forEach(function(q){if(dgame.npcq.claimed[q.k])gm.npcq.claimed[q.k]=1;});
      }
    }
    gm.visit=(dgame.visit!=null&&isFinite(dgame.visit))?Math.max(0,Math.min(R_TMAX,parseInt(dgame.visit,10))):null;
    gm.beenTo={};
    if(dgame.beenTo&&typeof dgame.beenTo==='object'){
      for(var bt=0;bt<=R_TMAX;bt++)if(dgame.beenTo[bt])gm.beenTo[bt]=1;
    }else{
      var btMax=Math.min(R_TMAX,(gm.flags&&gm.flags.champion)?R_TMAX:Math.min(gm.boss?gm.boss.idx:0,8));
      for(var bt2=0;bt2<=btMax;bt2++)gm.beenTo[bt2]=1;
    }
    gm.region=reg;
  }
  return gm;
  }
  var gm=sanitizeGame(d.game,region);
  var altGm=sanitizeGame(d.altGame,region==='hoenn'?'kanto':'hoenn');
  /* v6.4: the bodyweight log rides at the root, shared across regions */
  var nbw=Array.isArray(d.bw)?d.bw.filter(function(e){return e&&isFinite(e.ts)&&isFinite(e.w)&&+e.w>0;})
    .map(function(e){return {ts:+e.ts,w:Math.round(+e.w*10)/10};})
    .sort(function(x,y){return x.ts-y.ts;}).slice(-2000):[];
  state={version:+d.version||1,unit:d.unit==='lb'?'lb':'kg',groups:ng,logs:nl,sessions:ns,session:null,theme:d.theme==='day'?'day':'night',game:gm,altGame:altGm,region:region,gamePlayed:(d.gamePlayed||gm||altGm)?1:0,sound:d.sound!==false,bw:nbw};

function exportData(){
  var json=JSON.stringify(state,null,2);
  var name='gym-backup-'+dateKey(Date.now())+'.json';
  try{
    var file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
      navigator.share({files:[file],title:'Gym Tracker backup'}).catch(function(){});
      return;
    }
  }catch(e){}
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  toast('Backup downloaded');
}
function copyData(){
  var json=JSON.stringify(state);
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=json;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Copied — paste it somewhere safe');}
    catch(e){toast('⚠️ Copy failed — use Export instead');}
    ta.remove();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(function(){toast('Copied — paste it somewhere safe');},fallback);
  }else fallback();
}

        addMoney(trpay);
        if(trcandy)bagOf().rarecandy=(bagOf().rarecandy||0)+1;
        save();sfx('save');render(true);
        toast('+₽'+trpay.toLocaleString()+(trcandy?' + RARE CANDY':''));
      });
  }
  else if(a==='mb-fight'){
    if(!state.game||!roadActive())return;
    var mj=parseInt(b.dataset.j,10);
    if(state.game.road.mb[mj]){toast('Already beaten!');return;}
    if(state.session&&state.session.mode==='boss'){toast('Finish the gym battle first!');return;}
    if(state.session&&state.session.blackout){toast('Your team is out — heal up first!');return;}
    var mbD=mbFor(state.game.road.idx,mj);
    if(state.session){
      state.session.wild={sp:mbD.sp,lv:mbD.lv,hp:mbD.hp,max:mbD.hp,shiny:false,
        tr:{cls:mbD.cls,clsN:mbD.clsN,name:mbD.name,purse:mbD.purse,mb:mj,arena:mbD.arena}};
      state.session.bmsg=mbD.clsN+' '+mbD.name+' sent out '+DEX[mbD.sp].n+'!';
      save();sfx('battlestart');
      tab='workout';render();
      playVsFx(mbD.cls,mbD.clsN+' '+mbD.name);
    }else{
      pendingMb=mj;
      showChooserThenStart('train');
    }
  }
  else if(a==='quest-claim'){
    if(!state.game||!roadActive())return;
    var cqi=parseInt(b.dataset.qi,10);
    var cq=questsFor(state.game.road.idx)[cqi];
    if(cq&&questReady(cq)&&!questClaimed(cqi)){
      state.game.road.qdone[cqi]=1;
      var cqPay=Math.round(cq.reward*(1+0.08*perkN('deeppockets'))); // v6.8
      addMoney(cqPay);
      save();sfx('badge');
      toast('+₽'+cqPay.toLocaleString()+' from '+cq.clsN+' '+cq.name+'!');
      checkGameEvents();
      render(true);
    }
  }
  else if(a==='daily-claim'){
    if(!state.game)return;
    ensureDaily();
    var ddi=parseInt(b.dataset.di,10);
    var dq=dailyFor()[ddi];
    if(dq&&dailyProg(dq)>=dq.target&&!state.game.daily.claimed[ddi]){
      state.game.daily.claimed[ddi]=1;
      var dqPay=Math.round(dq.reward*(1+0.08*perkN('deeppockets'))); // v6.8
      addMoney(dqPay);
      // the flex streak: rest days (up to 3 calendar days between claims) never break it
      var dl=state.game.daily;
      if(dl.lastDone!==dl.date){
        dl.streak=(!dl.lastDone||dayGap(dl.lastDone,dl.date)>3)?1:(dl.streak||0)+1;
        dl.lastDone=dl.date;
      }
      if((dl.streak||0)>((state.game.bestStreak)||0))state.game.bestStreak=dl.streak; // TRAINER CARD rank
      save();sfx('badge');
      toast('+₽'+dqPay.toLocaleString()+' — daily done! 🔥'+dl.streak);
      render(true);
    }
  }
  else if(a==='npcq-claim'){
    if(!state.game)return;
    ensureNpcq();
    var nk=b.dataset.k,nq=null;
    NPCQ.forEach(function(x){if(x.k===nk)nq=x;});
    if(nq&&npcqOpen(nq)&&npcqProg(nq)>=nq.target&&!state.game.npcq.claimed[nk]){
      state.game.npcq.claimed[nk]=1;
      var nsh=Math.random()<0.1;
      addMon(nq.mon,nsh);
      save();sfx('catch');
      cry(nq.mon);
      if(nsh)setTimeout(function(){sfx('shiny');},600);
      showModal('<div style="text-align:center;padding-bottom:2px"><img src="sprites/npc/'+nq.npc+'.png" alt="" style="width:34px;image-rendering:pixelated"></div>'+
        '<h3 style="text-align:center">A gift from '+nq.who+'!</h3>'+
        '<p style="text-align:center">'+DEX[nq.mon].n+' joined your team!'+(nsh?' ✨ It’s SHINY!':'')+'</p>'+
        '<div style="text-align:center;padding:6px 0"><img class="bigspr'+(nsh?' shinyglow':'')+'" src="'+sprPath(nq.mon,nsh)+'" alt=""></div>'+
        '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>');
      modalOk=function(){closeModal();checkGameEvents();render(true);};
    }
  }
  else if(a==='show-hof'){showHofModal();}
  else if(a==='show-bag'){showBagModal();}
  else if(a==='show-medal'){showMedalModal(b.dataset.t);}
  else if(a==='pokecenter'){
    if(!state.game)return;
    tab='center';render();
  }
  else if(a==='rest-mon'){
    if(!state.game)return;
    if(state.session){toast('Finish your workout first!');return;}
    var rmM=findMon(b.dataset.m);
    if(rmM&&curHpOf(rmM)<maxHpOf(rmM)&&!restOf()[rmM.uid]){
      restOf()[rmM.uid]=Date.now()+restMsNow();
      save();sfx('save');render(true);
      toast(DEX[rmM.sp].n+' is resting — back in '+(restMsNow()/3600000)+'h');
    }
  }
  /* v6.6.1: the nurse's express lane — ₽500 flat, whole team, every branch */
  else if(a==='center-heal-all'){
    if(!state.game||state.session)return;
    if(money()<centerFee()){toast('Not enough ₽ — the free rest is always open.');return;}
    var healedList=[];
    state.game.mons.forEach(function(hm){
      var hmx=maxHpOf(hm),hcur=Math.max(0,Math.min(hmx,curHpOf(hm)));
      if(hcur<hmx||restOf()[hm.uid])healedList.push(hm);
    });
    if(!healedList.length)return;
    state.game.money-=centerFee();
    healedList.forEach(function(hm){
      if(state.game.hurt)delete state.game.hurt[hm.uid];
      delete restOf()[hm.uid];
    });
    save();
    sfx('heal');
    var healTray='';
    healedList.slice(0,6).forEach(function(hm,hi){
      healTray+='<span class="healslot" style="animation-delay:'+(hi*0.13)+'s">'+monIconImg(hm.sp,hm.shiny,34)+'</span>';
    });
    showModal('<div class="vbanner" style="font-size:13px;line-height:1.6;color:#58C868">ALL HEALED!</div>'+
      '<div style="text-align:center;padding:4px 0"><img src="sprites/npc/nurse.png" alt="" style="width:44px;height:44px;image-rendering:pixelated"></div>'+
      '<div style="display:flex;justify-content:center;gap:6px;padding:6px 0">'+healTray+'</div>'+
      '<p style="text-align:center">“Your POKEMON are fighting fit'+(healedList.length>6?' — all '+healedList.length+' of them':'')+'! We hope to see you again!”</p>'+
      '<div class="mbtns"><button class="btn acc" data-action="modal-ok">THANKS!</button></div>',true);
    modalOk=function(){closeModal();render(true);};
  }
  else if(a==='restore-mon'){
    if(!state.game)return;
    if(state.session){toast('Use the BAG in battle instead!');return;}
    var frM=findMon(b.dataset.m);
    if(frM&&(bagOf().fullrestore||0)>0&&curHpOf(frM)<maxHpOf(frM)){
      bagOf().fullrestore--;
      if(state.game.hurt)delete state.game.hurt[frM.uid];
      delete restOf()[frM.uid];
      save();sfx('levelup');render(true);
      toast(DEX[frM.sp].n+' is fully healed!');
    }
  }
  else if(a==='raid-start'){
    if(!state.game)return;
    var rsD=raidDef(b.dataset.k);
    if(!rsD||!raidUnlocked(rsD)||raidCaught(rsD.k))return;
    if(state.game.raid){toast('Finish your current raid first!');return;}
    state.game.raid={k:rsD.k,startTs:Date.now()};
    save();sfx('battlestart');
    showModal('<h3>RAID STARTED!</h3><p>'+esc(rsD.flavor)+'</p>'+
      '<div style="text-align:center;padding:8px 0"><img class="bigspr" src="sprites/'+DEX[rsD.k].id+'.png" alt=""></div>'+
      '<p style="text-align:center">Wear '+DEX[rsD.k].n+' down with '+rsD.target.toLocaleString()+' kg of lifting. Every set from now counts!</p>'+
      '<div class="mbtns"><button class="btn acc" data-action="close-modal">LET’S GO</button></div>');
    modalOk=null;
    render(true);
  }
  else if(a==='raid-quit'){
    if(state.game&&state.game.raid){
      showModal('<h3>Give up the raid?</h3><p>'+DEX[state.game.raid.k].n+' escapes and your raid progress is lost.</p>'+
        '<div class="mbtns"><button class="btn" data-action="close-modal">KEEP HUNTING</button><button class="btn acc" data-action="raid-quit-yes">GIVE UP</button></div>');
      modalOk=null;
    }
  }
  else if(a==='raid-quit-yes'){
    if(state.game){state.game.raid=null;save();}
    closeModal();render(true);
  }
  else if(a==='give-held'){
    var ghM=findMon(b.dataset.m),ghK=b.dataset.it;
    if(ghM&&ITEMS[ghK]&&ITEMS[ghK].hold&&(bagOf()[ghK]||0)>0){
      bagOf()[ghK]--;
      var ghOld=heldOf(ghM);
      if(ghOld)bagOf()[ghOld]=(bagOf()[ghOld]||0)+1;
      ghM.held=ghK;
      save();sfx('save');
      toast(DEX[ghM.sp].n+' is now holding '+ITEMS[ghK].n+'!');
      openMon(ghM.uid);
    }
  }
  else if(a==='take-held'){
    var thM=findMon(b.dataset.m),thK=heldOf(thM);
    if(thM&&thK){
      bagOf()[thK]=(bagOf()[thK]||0)+1;
      thM.held=null;
      save();
      toast('Took the '+ITEMS[thK].n+' back.');
      openMon(thM.uid);
    }
  }
  else if(a==='wake-mon'){
    if(state.game&&!state.session&&restOf()[b.dataset.m]){
      delete restOf()[b.dataset.m];
      save();render(true);
      toast('Rest cancelled — no harm done.');
    }
  }
  else if(a==='edit-party'){pendingParty=null;showPartyManager();}
  else if(a==='pm-toggle'){
    if(pendingParty){
      var pmi=pendingParty.indexOf(b.dataset.m);
      if(pmi>=0)pendingParty.splice(pmi,1);
      else if(pendingParty.length<6)pendingParty.push(b.dataset.m);
      else{toast('Party is full — six max!');return;}
      showPartyManager();
    }
  }
  else if(a==='pm-auto'){
    if(state.game){state.game.partyIds=null;pendingParty=null;save();closeModal();toast('Auto party: your top 6 by level');render(true);}
  }
  else if(a==='pm-save'){
    if(state.game&&pendingParty&&pendingParty.length){
      state.game.partyIds=pendingParty.slice();pendingParty=null;
      save();closeModal();toast('Party order saved ✓');render(true);
    }else toast('Pick at least one POKEMON');
  }
  else if(a==='use-vitamin'){
    var vk=b.dataset.it,vit=ITEMS[vk],vm=findMon(b.dataset.m);
    if(vit&&vit.v&&vm&&(bagOf()[vk]||0)>0){
      vm.vits=vm.vits||{};
      if((vm.vits[vit.v]||0)>=5){toast('It won’t have any effect!');return;}
      bagOf()[vk]--;
      vm.vits[vit.v]=(vm.vits[vit.v]||0)+1;
      sfx('pr');save();
      openMon(vm.uid);
      toast(DEX[vm.sp].n+'’s stat rose!');
    }
  }
  else if(a==='use-candy'){
    var cm=findMon(b.dataset.m);
    if(cm&&(bagOf().rarecandy||0)>0){
      var cl=monLevel(cm.xp);
      if(cl>=100){toast('It’s already at MAX level!');return;}
      bagOf().rarecandy--;
      cm.xp=Math.max(cm.xp,xpFloor(cl+1));
      sfx('pr');save();
      queueLevelUp(cm,cl,cl+1);
      openMon(cm.uid);
    }
  }
  else if(a==='reset-game'){
    if(!state.game){toast('No adventure to reset');return;}
    confirmModal('Restart the '+regionName()+' adventure?','Your '+regionName()+' team, badges and POKEDEX are wiped and '+profName()+' greets you again. The other region and all workout data stay untouched. No retro XP this time — a true fresh start.','Restart',function(){
      state.game=null;save();
      tab='summary';render();
      setTimeout(showStarterModal,350);
    });
  }
  else if(a==='pick-starter'){
    var ssp;
    if(inHoenn())ssp=HOENN_STARTERS.indexOf(b.dataset.sp)>=0?b.dataset.sp:'treecko';
    else ssp=b.dataset.sp==='squirtle'?'squirtle':'charmander';
    // Hoenn is a locked fresh start — no retro XP, ever
    var retro=(inHoenn()||state.gamePlayed)?0:Math.min(Math.round(totalVolumeAll()/10),xpFloor(15));
    state.game={startTs:Date.now(),starter:ssp,mons:[],active:null,enc:{},flags:{},seen:{},dex:{},round:1,
      boss:{idx:0,hp:BOSSES[0].hp},player:{name:pendingName||(inHoenn()?'BRENDAN':'RED'),spr:pendingGender||(inHoenn()?'brendan':'red')},
      money:3000,bag:{},hof:[],partyIds:null,egg:null,medals:{},hurt:{},raid:null,rest:{},road:null,roadLog:{},poi:{},bp:0,bestStreak:0,daily:null,npcq:null,visit:0,beenTo:{0:1},region:state.region};
    state.gamePlayed=1;
    var sm=addMon(ssp,false);
    sm.xp=retro;
    state.game.active=sm.uid;
    save();
    closeModal();
    var slv=monLevel(sm.xp);
    queueModal(function(){
      showModal('<h3>'+esc(DEX[ssp].n)+' joined you!</h3><p>'+
        (retro>0?('Your past training counts: +'+retro+' XP — it’s already LV '+slv+'! '):'')+
        'Every set you log earns it XP. You pick who trains at each workout start.</p>'+
        '<div style="text-align:center;padding:8px 0"><img class="bigspr" src="'+sprPath(ssp,false)+'" alt=""></div>'+
        '<div class="mbtns"><button class="btn acc" data-action="modal-ok">LET’S GO</button></div>',true);
      modalOk=function(){closeModal();tab='team';render();checkGameEvents();};
    });
  }
  else if(a==='evo-choice'){
    var em=findMon(b.dataset.m);
    if(em&&DEX[b.dataset.to]){closeModal();doEvolve(em,b.dataset.to);}
  }
  else if(a==='pick-gender'){
    pendingGender=['red','leaf','brendan','may'].indexOf(b.dataset.g)>=0?b.dataset.g:(inHoenn()?'brendan':'red');
    closeModal();
    promptModal('And your name is…?',state.game&&state.game.player?state.game.player.name:'',function(v){
      pendingName=v.toUpperCase().slice(0,10);
      afterNamePicked();
    },'OK');
  }
  else if(a==='rename-trainer'){
    if(!state.game)return;
    promptModal('Trainer name',playerName(),function(v){
      if(!state.game.player)state.game.player={name:inHoenn()?'BRENDAN':'RED',spr:inHoenn()?'brendan':'red'};
      state.game.player.name=v.toUpperCase().slice(0,10);
      save();render(true);
    });
  }
  else if(a==='sound'){
    state.sound=b.dataset.s==='on';
    save();render(true);
    if(state.sound)sfx('save');
  }
  else if(a==='devmode'){
    state.dev=b.dataset.d==='on';
    if(!state.dev&&state.game&&state.game.visit!=null&&state.game.visit>townIdx())state.game.visit=townIdx();
    save();render(true);
    toast(state.dev?'DEV MODE ON — every town open on the TOWN MAP':'DEV MODE OFF');
  }
  else if(a==='region'){switchRegion(b.dataset.r);}
  else if(a==='goto-edit'){tab='workout';editMode=true;render();}
  else if(a==='export'){exportData();}
  else if(a==='copy'){copyData();}
  else if(a==='import'){importModal();}
  else if(a==='reset'){
    confirmModal('Reset everything?','This permanently deletes all logged workouts and restores the default exercise list.','Delete all',function(){
      state=seedState();save();editMode=false;render();toast('Fresh start 🌱');
    });
  }
  else if(a==='add-group'){
    promptModal('New muscle group','',function(v){
      state.groups.push({id:uid(),name:v,exercises:[]});save();render(true);
    },'Add');
  }
  else if(a==='rename-group'){
    var g1=groupById(b.dataset.g);if(!g1)return;
    promptModal('Rename group',g1.name,function(v){g1.name=v;save();render(true);});
  }
  else if(a==='del-group'){
    var g2=groupById(b.dataset.g);if(!g2)return;
    confirmModal('Delete “'+g2.name+'”?',
      g2.exercises.length+' exercise(s) and '+logCount(g2)+' log entries will be deleted too.','Delete',function(){
      g2.exercises.forEach(function(ex){delete state.logs[ex.id];});
      state.groups=state.groups.filter(function(x){return x.id!==g2.id;});
      save();render(true);
    });
  }
  else if(a==='add-ex'){
    var g3=groupById(b.dataset.g);if(!g3)return;
    promptModal('New exercise in '+g3.name,'',function(v){
      g3.exercises.push({id:uid(),name:v,note:''});save();render(true);
    },'Add');
  }
  else if(a==='rename-ex'){
    var r1=exById(b.dataset.ex);if(!r1)return;
    promptModal('Rename exercise',r1.ex.name,function(v){r1.ex.name=v;save();render(true);});
  }
  else if(a==='del-ex'){
    var r2=exById(b.dataset.ex);if(!r2)return;
    var n=logsOf(r2.ex.id).length;
    confirmModal('Delete “'+r2.ex.name+'”?',
      n?('Its '+n+' log entries will be deleted too.'):'It has no logged entries.','Delete',function(){
      delete state.logs[r2.ex.id];
      r2.group.exercises=r2.group.exercises.filter(function(x){return x.id!==r2.ex.id;});
      save();render(true);
    });
  }
});

/* ===== init ===== */
// Surface unexpected errors instead of silently freezing a button press.
window.addEventListener('error',function(ev){
  try{toast('⚠️ '+String((ev&&ev.message)||'Something glitched').slice(0,90));}catch(e){}
});
setRegionTables(); // active region's tables must be live before migrations touch BOSSES/TOWNS
var staleNote=migrateState();
setRegionTables(); // migrations may have (re)set state.region on old saves
applyTheme();
render();
ensureTicker();
if(staleNote)setTimeout(function(){toast(staleNote);},600);
if(!state.game)setTimeout(showGenderModal,450);
else{
  if(!state.game.player)setTimeout(showGenderModal,450);
  setTimeout(checkGameEvents,900);
}
// the demo skips the offline cache: a visitor trying it once shouldn't download every sprite
if('serviceWorker' in navigator&&!DEMO){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
</script>
</body>
</html>
