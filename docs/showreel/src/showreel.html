<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym Tracker Showreel</title>
<!-- The 15-second README showreel, as code. One deterministic canvas timeline: render(t) draws
     the frame at t seconds. Serve the repo root over http and open this page to watch it
     (space = pause, arrows = step); render.mjs drives it frame by frame to make the video. -->
<style>
  html, body { margin: 0; height: 100%; background: #0b0e1a; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { display: block; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

/* ================================================================
   Timeline: 128 BPM, 8 bars of 4/4 = exactly 15.0 s. Every cut and hit sits on the grid,
   rounded to a whole frame so cuts land between frames.
   ================================================================ */
const W = 1920, H = 1080, FPS = 60, DUR = 15;
const BT = 60 / 128;
const b = n => Math.round(n * BT * FPS) / FPS;

const QS = new URLSearchParams(location.search);
const RENDER = QS.has('render');
const SCALE = +(QS.get('scale') || 1);

const T = {
  drop: b(4),        // ball bursts open: LOG A SET
  tap: b(6.5),       // SAVE SET
  whip: b(7.5),      // whip pan into the battle
  battle: b(8),      // flamethrower
  hit: b(9),         // critical hit
  throwB: b(11),     // ball thrown
  catchHit: b(11.5),
  land: b(12),
  wob1: b(12.5), wob2: b(13), click: b(13.5),
  dex: b(14),        // zoom out to the Pokédex wall
  vs: b(16),         // league
  level: b(20),      // trainer level + cards
  regions: b(24),    // Kanto
  hoenn: b(26),      // Hoenn
  logo: b(28),       // end card
};

/* ================================================================
   Math, easing, randomness
   ================================================================ */
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const lerp = (a, c, t) => a + (c - a) * t;
const seg = (t, a, c) => clamp((t - a) / (c - a));
const TAU = Math.PI * 2;
const E = {
  lin: t => t,
  inQuad: t => t * t,
  outQuad: t => 1 - (1 - t) * (1 - t),
  inOutQuad: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  inQuart: t => t * t * t * t,
  outQuart: t => 1 - Math.pow(1 - t, 4),
  inOutQuart: t => t < .5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2,
  outQuint: t => 1 - Math.pow(1 - t, 5),
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inOutExpo: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
  inBack: (t, s = 1.70158) => (s + 1) * t * t * t - s * t * t,
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1,
};
// damped oscillation that starts at 0 with a kick: for wobbles, bounces, squash
const wob = (dt, freq, decay) => dt <= 0 ? 0 : Math.exp(-dt * decay) * Math.sin(dt * freq * TAU);
// spring toward 1 (value 0 at dt=0)
const spring = (dt, freq = 3, zeta = .45) => dt <= 0 ? 0 :
  1 - Math.exp(-zeta * TAU * freq * dt) * Math.cos(TAU * freq * Math.sqrt(1 - zeta * zeta) * dt);

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, c, t) {
  const A = hexRgb(a), B = hexRgb(c);
  return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`;
}
function rgba(h, a) { const [r, g, c] = hexRgb(h); return `rgba(${r},${g},${c},${a})`; }

/* ================================================================
   Look: palette and type
   ================================================================ */
const C = {
  navy: '#10152A', navyHi: '#1D2A5C', night: '#0A0D1C',
  ink: '#182028', paper: '#E8EDF3', muted: '#5A6572',
  white: '#FFFFFF', cream: '#FFF8EC',
  red: '#EE4035', red2: '#C62F26', redDeep: '#7E1A16',
  yellow: '#FFD23F', gold: '#F2B233', orange: '#FF8A2A',
  blue: '#2B64DC', blue2: '#1C47A8', blueHi: '#5A8CFF',
  green: '#2F8A3A', greenBg: '#EFF7EC', greenSoft: '#D5EBCF',
  hpG: '#58D068', hpY: '#F8C030', hpR: '#F05030', exp: '#4C8CF0',
  purple: '#9B5CFF', purpleDeep: '#2A1C5A',
};
const F = {
  bc: (px, w = 900, it = true) => `${it ? 'italic ' : ''}${w} ${px}px "Barlow Condensed"`,
  px: px => `${px}px "Press Start 2P"`,
  vt: px => `${px}px "VT323"`,
};

/* ================================================================
   Assets: everything comes from the app's own folders
   ================================================================ */
const ROOT = '../../../';
const KANTO_IDS = Array.from({ length: 151 }, (_, i) => i + 1);
const HOENN_IDS = [169,170,171,172,174,177,178,182,183,184,202,203,214,218,219,222,227,230,231,232]
  .concat(Array.from({ length: 135 }, (_, i) => 252 + i));
const DEX = KANTO_IDS.concat(HOENN_IDS);            // 306 species across both campaigns
const LEADERS = [
  { k: 'brock', n: 'BROCK', badge: 'rock', col: '#A8844E' },
  { k: 'misty', n: 'MISTY', badge: 'water', col: '#3B7FD9' },
  { k: 'ltsurge', n: 'LT. SURGE', badge: 'electric', col: '#E2A81E' },
  { k: 'erika', n: 'ERIKA', badge: 'grass', col: '#3AA55E' },
  { k: 'koga', n: 'KOGA', badge: 'poison', col: '#8A4FC4' },
  { k: 'sabrina', n: 'SABRINA', badge: 'psychic', col: '#DB4F8E' },
  { k: 'blaine', n: 'BLAINE', badge: 'fire', col: '#EE6A2C' },
  { k: 'giovanni', n: 'GIOVANNI', badge: 'ground', col: '#8C6A45' },
];
const IMG = {};
function assetList() {
  const L = {
    arena: 'sprites/arenas/grass.png',
    back6: 'sprites/back/6.png',
    mon25: 'sprites/25.png',
    mon68: 'sprites/68.png',
    art6: 'sprites/art/6.png',
    art384: 'sprites/art/384.png',
    red: 'sprites/trainers/red.png',
    kanto: 'map/kanto.png',
    hoenn: 'map/hoenn.png',
    scope: 'sprites/items/scopelens.png',
    ultra: 'sprites/items/ultraball.png',
    candy: 'sprites/items/rarecandy.png',
  };
  for (const l of LEADERS) { L['tr_' + l.k] = 'sprites/trainers/' + l.k + '.png'; L['bd_' + l.badge] = 'sprites/badges/' + l.badge + '.png'; }
  for (const id of DEX) L['ic' + id] = 'sprites/icons/' + id + '.png';
  return L;
}
function loadImage(src) {
  return new Promise((ok, fail) => {
    const im = new Image();
    im.onload = () => ok(im);
    im.onerror = () => fail(new Error('missing ' + src));
    im.src = src;
  });
}
const FONTS = [
  ['Barlow Condensed', 'fonts/barlow-condensed-latin-900-italic.woff2', { weight: '900', style: 'italic' }],
  ['Barlow Condensed', 'fonts/barlow-condensed-latin-800-italic.woff2', { weight: '800', style: 'italic' }],
  ['Barlow Condensed', 'fonts/barlow-condensed-latin-600-italic.woff2', { weight: '600', style: 'italic' }],
  ['Barlow Condensed', 'fonts/barlow-condensed-latin-700-normal.woff2', { weight: '700', style: 'normal' }],
  ['Press Start 2P', ROOT + 'fonts/press-start-2p.woff2', {}],
  ['VT323', ROOT + 'fonts/vt323.woff2', {}],
];
async function preload() {
  await Promise.all(FONTS.map(async ([fam, src, desc]) => {
    const f = new FontFace(fam, `url(${src})`, desc);
    await f.load();
    document.fonts.add(f);
  }));
  const L = assetList();
  await Promise.all(Object.entries(L).map(async ([k, p]) => { IMG[k] = await loadImage(ROOT + p); IMG[k]._k = k; }));
}

/* ================================================================
   Canvas and drawing kit
   ================================================================ */
const cv = document.getElementById('c');
cv.width = W * SCALE; cv.height = H * SCALE;
const ctx0 = cv.getContext('2d', { willReadFrequently: RENDER });
let ctx = ctx0;

function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// text with optional stroke, hard offset shadow, rotation, scale, letter spacing
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.font = o.font || F.bc(100);
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'middle';
  ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  if (o.sc != null) ctx.scale(o.sc, o.sc * (o.sy ?? 1));
  ctx.lineJoin = 'round';
  const lw = o.lw || 10;
  if (o.shadow) {
    const [dx, dy, col] = o.shadow;
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = lw;
    if (o.stroke) ctx.strokeText(s, dx, dy);
    ctx.fillText(s, dx, dy);
  }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = lw; ctx.strokeText(s, 0, 0); }
  if (o.fill !== null) { ctx.fillStyle = o.fill || C.white; ctx.fillText(s, 0, 0); }
  ctx.restore();
}
function textW(s, font, ls = 0) { ctx.save(); ctx.font = font; ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w; }

// sprite: nearest-neighbour unless smooth; anchor bottom-centre by default
function spr(im, x, y, s, o = {}) {
  if (!im) return;
  ctx.save();
  ctx.imageSmoothingEnabled = !!o.smooth;
  ctx.imageSmoothingQuality = 'high';
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  ctx.scale(s * (o.sx ?? 1) * (o.flip ? -1 : 1), s * (o.sy ?? 1));
  ctx.drawImage(im, -im.width * (o.ax ?? .5), -im.height * (o.ay ?? 1));
  ctx.restore();
}
const TINTS = new Map();
function tinted(im, col) {
  const k = im._k + col;
  if (!TINTS.has(k)) {
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
    const g = c.getContext('2d'); g.drawImage(im, 0, 0);
    g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
    c._k = k; TINTS.set(k, c);
  }
  return TINTS.get(k);
}

// soft additive light
function glow(x, y, r, col, a = 1) {
  if (r <= 0 || a <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(.35, rgba(col, a * .45)); g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.restore();
}
function ring(x, y, r, lw, col, a = 1) {
  if (a <= 0 || lw <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = col; ctx.lineWidth = lw; circle(x, y, r); ctx.stroke(); ctx.restore();
}
function shock(t, t0, x, y, o = {}) {
  const p = seg(t, t0, t0 + (o.dur || .4));
  if (p <= 0 || p >= 1) return;
  ring(x, y, lerp(o.r0 ?? 20, o.r1 ?? 400, E.outCubic(p)), (o.lw ?? 18) * (1 - p), o.col || C.white, (o.a ?? 1) * (1 - p));
}
// anime focus lines converging on a point
function speedLines(cx, cy, o) {
  const R = rng(o.seed || 1);
  ctx.save(); ctx.fillStyle = o.col || C.white; ctx.globalAlpha *= o.a ?? 1;
  const rot = o.rot || 0;
  for (let i = 0; i < o.n; i++) {
    const a = R() * TAU + rot, w = (o.w || .012) * (.35 + R()), r0 = o.r0 * (.75 + .6 * R()), far = 2600;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a - w) * far, cy + Math.sin(a - w) * far);
    ctx.lineTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a + w) * far, cy + Math.sin(a + w) * far);
    ctx.fill();
  }
  ctx.restore();
}
function starPath(cx, cy, r0, r1, n, rot, seed = 0) {
  const R = rng(seed + 11);
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i * Math.PI / n, r = i % 2 ? r0 : r1 * (seed ? .82 + .36 * R() : 1);
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function dotGrid(t, col, a, step, size, drift) {
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = col;
  const ox = (t * drift) % step, oy = (t * drift * .5) % step;
  for (let y = -step + oy; y < H + step; y += step)
    for (let x = -step + ox; x < W + step; x += step) ctx.fillRect(x, y, size, size);
  ctx.restore();
}
function shakeAt(t, evs) {
  let x = 0, y = 0, r = 0;
  for (const [t0, dur, amp, seed = 1] of evs) {
    const p = (t - t0) / dur;
    if (p < 0 || p > 1) continue;
    const k = amp * (1 - p) * (1 - p), d = t - t0;
    x += k * Math.sin(d * 83 + seed); y += k * Math.sin(d * 71 + seed * 2.3 + 1.3); r += k * .0011 * Math.sin(d * 57 + seed);
  }
  return { x, y, r };
}
function camera(sk, zoom = 1, cx = 960, cy = 540) {
  ctx.translate(cx + sk.x, cy + sk.y); ctx.rotate(sk.r); ctx.scale(zoom, zoom); ctx.translate(-cx, -cy);
}
function typed(s, t, t0, cps = 55) { return t < t0 ? '' : s.slice(0, Math.floor((t - t0) * cps) + 1); }
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }

/* ---------- the two faces of the hero coin: a 20 kg plate and a Poké Ball ---------- */
function plateFace(r) {
  ctx.fillStyle = C.blue; circle(0, 0, r); ctx.fill();
  const g = ctx.createLinearGradient(-r, -r, r, r);
  g.addColorStop(0, 'rgba(255,255,255,.22)'); g.addColorStop(.5, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g; circle(0, 0, r); ctx.fill();
  ctx.lineWidth = r * .07; ctx.strokeStyle = C.blue2; circle(0, 0, r * .955); ctx.stroke();
  ctx.lineWidth = r * .018; ctx.strokeStyle = 'rgba(0,0,0,.28)'; circle(0, 0, r * .8); ctx.stroke();
  ctx.lineWidth = r * .012; ctx.strokeStyle = 'rgba(255,255,255,.18)'; circle(0, 0, r * .83); ctx.stroke();
  const hub = r * .3, hg = ctx.createLinearGradient(-hub, -hub, hub, hub);
  hg.addColorStop(0, '#F4F6FA'); hg.addColorStop(.5, '#B7BEC9'); hg.addColorStop(1, '#7D8694');
  ctx.fillStyle = hg; circle(0, 0, hub); ctx.fill();
  ctx.lineWidth = r * .025; ctx.strokeStyle = '#5E6674'; circle(0, 0, hub); ctx.stroke();
  ctx.fillStyle = '#0B0E18'; circle(0, 0, r * .12); ctx.fill();
  ctx.lineWidth = r * .02; ctx.strokeStyle = '#3A404C'; circle(0, 0, r * .12); ctx.stroke();
  txt('20 KG', 0, -r * .55, { font: F.bc(Math.round(r * .3)), fill: C.white });
  txt('GYM TRACKER', 0, r * .56, { font: F.bc(Math.round(r * .13), 700, false), fill: 'rgba(255,255,255,.8)', ls: r * .02 });
}
// part: 'all' | 'top' | 'bottom' (the halves split along the band's centre line)
function ballFace(r, part = 'all', o = {}) {
  const bh = r * .085, lw = r * .05;
  ctx.save();
  if (part !== 'all') { ctx.beginPath(); part === 'top' ? ctx.rect(-r * 1.2, -r * 1.2, r * 2.4, r * 1.2) : ctx.rect(-r * 1.2, 0, r * 2.4, r * 1.2); ctx.clip(); }
  // shell
  ctx.fillStyle = '#F4F1EA'; circle(0, 0, r); ctx.fill();
  ctx.save(); circle(0, 0, r); ctx.clip();
  ctx.fillStyle = o.top || C.red; ctx.fillRect(-r, -r, r * 2, r);
  const sh = ctx.createRadialGradient(-r * .35, -r * .45, r * .1, 0, 0, r * 1.05);
  sh.addColorStop(0, 'rgba(255,255,255,.28)'); sh.addColorStop(.55, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,.3)');
  ctx.fillStyle = sh; ctx.fillRect(-r, -r, r * 2, r * 2);
  ctx.fillStyle = '#15131A'; ctx.fillRect(-r, -bh, r * 2, bh * 2);
  ctx.restore();
  ctx.lineWidth = lw; ctx.strokeStyle = '#15131A'; circle(0, 0, r - lw / 2); ctx.stroke();
  // button
  ctx.fillStyle = '#15131A'; circle(0, 0, r * .3); ctx.fill();
  ctx.fillStyle = o.button || '#F4F1EA'; circle(0, 0, r * .2); ctx.fill();
  ctx.lineWidth = r * .025; ctx.strokeStyle = 'rgba(0,0,0,.18)'; circle(0, 0, r * .14); ctx.stroke();
  // specular
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(-r * .42, -r * .55, r * .2, r * .1, -.6, 0, TAU); ctx.fill();
  ctx.restore();
}
// a disc spinning about its vertical axis: plate on the front, ball on the back
function coin(x, y, r, theta, sx = 1, sy = 1) {
  const c = Math.cos(theta), s = Math.sin(theta), k = Math.max(.002, Math.abs(c));
  const front = c >= 0, th = r * .2 * Math.abs(s), dir = (s * c >= 0) ? 1 : -1;
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, sy);
  if (th > .5) {
    ctx.fillStyle = front ? '#132F72' : '#15131A';
    ctx.beginPath(); ctx.ellipse(-dir * th / 2, 0, r * k, r, 0, 0, TAU); ctx.fill();
    ctx.fillRect(-th / 2, -r, th, r * 2);
  }
  ctx.translate(dir * th / 2, 0); ctx.scale(k, 1);
  front ? plateFace(r) : ballFace(r);
  ctx.restore();
}

/* ---------- small UI kit that mirrors the app ---------- */
function hpBar(x, y, w, h, frac, label = 'HP') {
  const col = frac > .5 ? C.hpG : frac > .2 ? C.hpY : C.hpR;
  if (label) {
    rrect(x, y - 2, h * 2.2, h + 4, 6); ctx.fillStyle = '#5A4A3A'; ctx.fill();
    txt(label, x + h * 1.1, y + h / 2 + 1, { font: F.px(Math.round(h * .62)), fill: label === 'HP' ? '#F8B838' : '#8FB4FF' });
    x += h * 2.4; w -= h * 2.4;
  }
  rrect(x, y, w, h, h / 2); ctx.fillStyle = '#4E4A48'; ctx.fill();
  if (frac > 0) { rrect(x + 3, y + 3, Math.max(h - 6, (w - 6) * frac), h - 6, (h - 6) / 2); ctx.fillStyle = label === 'EXP' ? C.exp : col; ctx.fill(); }
}
function panel(x, y, w, h, o = {}) {
  ctx.save();
  if (o.shadow) { ctx.shadowColor = 'rgba(16,21,42,.28)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18; }
  rrect(x, y, w, h, o.r ?? 22); ctx.fillStyle = o.fill || C.cream; ctx.fill();
  ctx.restore();
  if (o.border) { ctx.save(); rrect(x, y, w, h, o.r ?? 22); ctx.lineWidth = o.lw || 6; ctx.strokeStyle = o.border; ctx.stroke(); ctx.restore(); }
}
function playTri(x, y, s, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x - s * .45, y - s * .55); ctx.lineTo(x + s * .6, y); ctx.lineTo(x - s * .45, y + s * .55); ctx.closePath(); ctx.fill(); }

/* ================================================================
   01  HOOK — "EVERY SET IS AN ATTACK"  (bar 1)
   ================================================================ */
const PR = 215;                      // plate / ball radius
const HOOK_WORDS = [
  { s: 'EVERY', side: -1, t0: b(0), t1: b(2), fill: C.white, sh: C.blue },
  { s: 'SET', side: 1, t0: b(1), t1: b(3), fill: C.yellow, sh: C.blue },
  { s: 'IS AN', side: -1, t0: b(2), t1: 99, fill: C.white, sh: C.red },
  { s: 'ATTACK', side: 1, t0: b(3), t1: 99, fill: C.yellow, sh: C.red },
];
function hookWord(w, t) {
  if (t < w.t0) return;
  const pOut = seg(t, w.t1, w.t1 + .12);
  if (pOut >= 1) return;
  const pIn = seg(t, w.t0, w.t0 + .22), eIn = E.outExpo(pIn);
  const font = F.bc(230), x = 960 + w.side * (PR + 70), align = w.side < 0 ? 'right' : 'left';
  const sc = lerp(1.6, 1, eIn) * lerp(1, .8, E.inQuad(pOut));
  const dx = w.side * 110 * (1 - eIn), dy = -w.side * 150 * E.inQuad(pOut);
  const a = seg(t, w.t0, w.t0 + .04) * (1 - pOut);

    const fp = seg(t, c.flip, c.flip + .24), ang = Math.PI * E.inOutCubic(fp);
    const k = Math.abs(Math.cos(ang)), face = ang > Math.PI / 2;
    ctx.save(); ctx.globalAlpha = P.a; ctx.translate(P.x, P.y); ctx.rotate(P.rot); ctx.scale(P.s * Math.max(.02, k), P.s * (1 + .06 * Math.sin(fp * Math.PI)));
    if (face && c.rar === 'EPIC') {
      const pulse = .6 + .4 * Math.sin(t * 14);
      ctx.save(); ctx.shadowColor = C.purple; ctx.shadowBlur = 60 * pulse; rrect(-CW / 2, -CH / 2, CW, CH, 26); ctx.fillStyle = C.purple; ctx.fill(); ctx.restore();
    }
    face ? cardFace(c, CW, CH, t) : cardBack(CW, CH);
    ctx.restore();
    const pf = seg(t, c.flip + .12, c.flip + .5);
    if (pf > 0 && pf < 1) glow(P.x, P.y, 380, c.col, .55 * (1 - pf));
  }
  // caption, then the choose button in its place
  const pc = seg(t, b(23), b(23) + .25);
  if (pc > 0) {
    const s = E.outBack(pc, 2);
    ctx.save(); ctx.translate(960, 968); ctx.scale(s, s);
    rrect(-330, -46, 660, 92, 16); ctx.fillStyle = '#F8DCCF'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = C.red; ctx.stroke();
    txt('CHOOSE TITAN SLAYER', 0, 4, { font: F.px(24), fill: C.ink });
    ctx.restore();
  } else {
    txt('EVERY LEVEL: PICK 1 OF 3 · 37 CARDS', 960, 962, { font: F.px(24), fill: '#CFC4F4', alpha: seg(t, b(21.5), b(22)) });
  }
}

/* ================================================================
   06  TWO REGIONS — Kanto, then the S.S. Tidal to Hoenn (bar 7)
   ================================================================ */
function regionPanel(t, t0, o) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, o.c1); g.addColorStop(1, o.c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  stripes(t, 'rgba(255,255,255,.05)', 1);
  // map card
  const pm = E.outExpo(seg(t, t0 + .02, t0 + .45));
  const mx = 1270 + 700 * (1 - pm), my = 520 + Math.sin(t * 2) * 8, rot = o.rot + (1 - pm) * .3;
  const im = IMG[o.map], sw = o.crop ? o.crop[2] : im.width, sh = o.crop ? o.crop[3] : im.height;
  const ms = 900 / sw, mw = sw * ms, mh = sh * ms;
  ctx.save(); ctx.translate(mx, my); ctx.rotate(rot);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 24;
  rrect(-mw / 2 - 18, -mh / 2 - 18, mw + 36, mh + 36, 20); ctx.fillStyle = C.white; ctx.fill(); ctx.restore();
  ctx.imageSmoothingEnabled = false;
  const [sx0, sy0] = o.crop || [0, 0];
  ctx.drawImage(im, sx0, sy0, sw, sh, -mw / 2, -mh / 2, mw, mh);
  ctx.restore();
  // hero artwork pops out of the map
  const pa = seg(t, t0 + .12, t0 + .5);
  if (pa > 0) {
    const s = o.artS * E.outBack(pa, 1.6);
    spr(IMG[o.art], mx + o.artDX, my + o.artDY + Math.sin(t * 3) * 10, s, { smooth: true, rot: o.artRot + Math.sin(t * 2) * .02 });
  }
  // title block
  const pt = E.outExpo(seg(t, t0 + .04, t0 + .42));
  ctx.save(); ctx.beginPath(); ctx.rect(80, 250, 900, 560); ctx.clip();
  txt(o.label, 132, 388 - 80 * (1 - pt), { font: F.px(26), align: 'left', fill: C.white, alpha: .85 });
  txt(o.name, 118, 540 + 300 * (1 - pt), { font: F.bc(270), align: 'left', fill: C.white, shadow: [12, 12, o.shadow] });
  txt(o.sub, 134, 690 + 200 * (1 - pt), { font: F.px(28), align: 'left', fill: C.white });
  ctx.restore();
}
const KANTO = { c1: '#F2583A', c2: '#B8231C', map: 'kanto', crop: [0, 0, 174, 141], rot: -.05, art: 'art6', artS: 2.3, artDX: -110, artDY: 360, artRot: -.05, label: 'REGION 1 · FIRERED', name: 'KANTO', sub: '151 POKÉMON · 8 GYMS', shadow: '#7E1A16' };
const HOENN = { c1: '#1FB57C', c2: '#0B6A4A', map: 'hoenn', crop: null, rot: .05, art: 'art384', artS: 2.5, artDX: -130, artDY: 370, artRot: .05, label: 'REGION 2 · EMERALD', name: 'HOENN', sub: '202 POKÉMON · 8 GYMS', shadow: '#064A33' };
function sceneRegions(t) {
  regionPanel(t, T.regions, KANTO);
  // the wipe to Hoenn rides a diagonal wave
  const pw = seg(t, T.hoenn - .12, T.hoenn + .12);
  if (pw > 0) {
    const e = E.inOutCubic(pw), x = lerp(-700, W + 700, e);
    ctx.save();
    ctx.beginPath(); ctx.moveTo(-800, 0); ctx.lineTo(x + 300, 0); ctx.lineTo(x - 300, H); ctx.lineTo(-800, H); ctx.closePath(); ctx.clip();
    regionPanel(t, T.hoenn - .06, HOENN);
    ctx.restore();
    if (pw < 1) {
      ctx.save(); ctx.strokeStyle = C.white; ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(x + 300, 0); ctx.lineTo(x - 300, H); ctx.stroke();
      ctx.lineWidth = 8; ctx.strokeStyle = C.yellow; ctx.beginPath(); ctx.moveTo(x + 340, 0); ctx.lineTo(x - 260, H); ctx.stroke(); ctx.restore();
    }
  }
  // S.S. TIDAL ticket that slides across on the change
  const pk = seg(t, T.hoenn - .3, T.hoenn + .35);
  if (pk > 0 && pk < 1) {
    const x = lerp(-400, W + 400, E.inOutCubic(pk));
    ctx.save(); ctx.translate(x, 900); ctx.rotate(-.04);
    rrect(-300, -48, 600, 96, 14); ctx.fillStyle = C.cream; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = C.ink; ctx.stroke();
    txt('S.S. TIDAL · KANTO » HOENN', 0, 3, { font: F.px(20), fill: C.ink });
    ctx.restore();
  }
}

/* ================================================================
   END CARD — the ball closes, the barbell slides through (bar 8)
   ================================================================ */
const LOGO = { x: 960, y: 372, r: 150 };
function ballClose(t) {       // two halves slam shut over the regions
  const p = seg(t, T.logo - .24, T.logo);
  if (p <= 0) return false;
  const r = LOGO.r * 8.2, d = 580 * (1 - E.inCubic(p));
  ctx.save(); ctx.translate(960, 540 - d); ballFace(r, 'top'); ctx.restore();
  ctx.save(); ctx.translate(960, 540 + d); ballFace(r, 'bottom'); ctx.restore();
  return true;
}
function barbell(t, x, y) {
  const pb = E.outExpo(seg(t, T.logo + .16, T.logo + .4));
  if (pb <= 0) return;
  const half = 470 * pb;
  ctx.save();
  const bg = ctx.createLinearGradient(0, y - 12, 0, y + 12);
  bg.addColorStop(0, '#F2F4F8'); bg.addColorStop(.5, '#A9B1BE'); bg.addColorStop(1, '#6E7684');
  rrect(x - half, y - 11, half * 2, 22, 11); ctx.fillStyle = bg; ctx.fill();
  const plates = [[235, 44, 230, C.red, b(28.5)], [290, 36, 170, C.blue, b(28.75)]];
  for (const side of [-1, 1]) {
    for (const [off, pw, ph, col, t0] of plates) {
      const q = seg(t, t0, t0 + .1);
      if (q <= 0) continue;
      const e = E.outBack(q, 2), px = x + side * (off + 120 * (1 - e));
      ctx.save(); ctx.globalAlpha = clamp(q * 3);
      rrect(px - pw / 2, y - ph / 2, pw, ph, 10); ctx.fillStyle = col; ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = C.white; ctx.stroke();
      ctx.restore();
    }
    rrect(x + side * 205 - 10, y - 26, 20, 52, 6); ctx.fillStyle = '#C9CFD8'; ctx.fill();
  }
  ctx.restore();
}
function sceneLogo(t) {
  const g = ctx.createRadialGradient(960, 420, 60, 960, 540, 1200);
  g.addColorStop(0, C.navyHi); g.addColorStop(1, '#0A0D1E');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  dotGrid(t, '#FFFFFF', .06, 44, 3, 18);
  sparkles(t, '#B8C8FF', .5);
  const pz = E.outExpo(seg(t, T.logo, T.logo + .42));
  const r = lerp(LOGO.r * 8.2, LOGO.r, pz), y = lerp(540, LOGO.y, pz);
  const sk = shakeAt(t, [[T.logo, .3, 20], [b(28.5), .12, 8, 2], [b(28.75), .12, 8, 3]]);
  ctx.save(); camera(sk);
  const float = Math.sin((t - T.logo) * 2.2) * 6 * seg(t, T.logo + .5, T.logo + 1);
  barbell(t, LOGO.x, LOGO.y + float);
  shock(t, T.logo + .02, LOGO.x, LOGO.y, { r0: LOGO.r, r1: 900, lw: 30, dur: .5 });
  const beatPulse = Math.pow(1 - ((t - T.logo) / BT % 1), 3) * seg(t, T.logo + .6, T.logo + .7);
  ctx.save(); ctx.translate(LOGO.x, y + float); ballFace(r, 'all', { button: mix('#F4F1EA', '#FFE78A', beatPulse) }); ctx.restore();
  if (beatPulse > 0) glow(LOGO.x, LOGO.y + float, 90, C.yellow, .5 * beatPulse);
  // wordmark: letters drop in on a stagger
  const word = 'GYM TRACKER', font = F.px(92), full = textW(word, font);
  let cx = 960 - full / 2;
  for (let i = 0; i < word.length; i++) {
    const ch = word[i], w = textW(ch, font), t0 = b(29) + i * .028, q = seg(t, t0, t0 + .22);
    if (q > 0 && ch !== ' ') txt(ch, cx + w / 2, 640 - 70 * (1 - E.outBack(q, 2.4)), { font, fill: C.white, shadow: [0, 10, C.red], alpha: clamp(q * 4) });
    cx += w;
  }
  const pt = E.outCubic(seg(t, b(29.5), b(30)));
  ctx.save(); ctx.beginPath(); ctx.rect(960 - 900 * pt, 700, 1800 * pt, 80); ctx.clip();
  txt('THE POKÉMON GAME YOU PLAY BY LIFTING', 960, 742, { font: F.bc(56, 800), fill: C.yellow, ls: 4 });
  ctx.restore();
  const pc = seg(t, b(30), b(30) + .25);
  if (pc > 0) {
    const s = E.outBack(pc, 2.2);
    ctx.save(); ctx.translate(960, 856); ctx.scale(s, s);
    rrect(-410, -52, 820, 104, 52); ctx.fillStyle = C.white; ctx.fill();
    circle(-350, 0, 34); ctx.fillStyle = C.red; ctx.fill();
    playTri(-346, 0, 28, C.white);
    txt('PLAY FREE IN YOUR BROWSER', 36, 4, { font: F.px(24), fill: C.ink });
    ctx.restore();
  }
  const pu = seg(t, b(30.25), b(30.75));
  if (pu > 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(960 - 700 * E.outCubic(pu), 920, 1400 * E.outCubic(pu), 60); ctx.clip();
    txt('mateuszkrw-coder.github.io/gym-tracker-pokemon-game', 960, 950, { font: F.vt(46), fill: C.white });
    ctx.restore();
  }
  txt('NO ACCOUNT  ·  WORKS OFFLINE  ·  YOUR DATA STAYS ON YOUR PHONE', 960, 1016, { font: F.bc(30, 700, false), fill: '#8FA0CF', ls: 3, alpha: seg(t, b(30.5), b(31)) });
  ctx.restore();
}

/* ================================================================
   Chapter HUD: where you are in the story (bars 2–7)
   ================================================================ */
const CHAPTERS = [[T.drop, 'LOG'], [T.battle, 'FIGHT'], [T.throwB, 'CATCH'], [T.vs, 'CONQUER'], [T.level, 'LEVEL UP'], [T.regions, 'EXPLORE']];
function hud(t) {
  const a = seg(t, T.drop + .25, T.drop + .45) * (1 - seg(t, T.logo - .25, T.logo - .1));
  if (a <= 0) return;
  let ci = 0; for (let i = 0; i < CHAPTERS.length; i++) if (t >= CHAPTERS[i][0]) ci = i;
  const since = t - CHAPTERS[ci][0];
  ctx.save(); ctx.globalAlpha = a;
  const x = 56, y = 48;
  rrect(x, y, 430, 64, 32); ctx.fillStyle = 'rgba(12,15,30,.88)'; ctx.fill();
  rrect(x + 8, y + 8, 76, 48, 24); ctx.fillStyle = C.yellow; ctx.fill();
  txt('0' + (ci + 1), x + 46, y + 34, { font: F.px(20), fill: C.ink });
  ctx.save(); ctx.beginPath(); ctx.rect(x + 96, y, 320, 64); ctx.clip();
  const q = E.outExpo(seg(since, 0, .25));
  if (ci > 0 && q < 1) txt(CHAPTERS[ci - 1][1], x + 104, y + 34 - 50 * q, { font: F.px(20), align: 'left', fill: C.white, alpha: 1 - q });
  txt(CHAPTERS[ci][1], x + 104, y + 34 + 50 * (1 - q), { font: F.px(20), align: 'left', fill: C.white });
  ctx.restore();
  // progress ticks
  for (let i = 0; i < 6; i++) {
    rrect(x + 300 + i * 20, y + 26, 14, 12, 3);
    ctx.fillStyle = i < ci ? C.white : i === ci ? C.yellow : 'rgba(255,255,255,.22)'; ctx.fill();
  }
  ctx.restore();
}

/* ================================================================
   Transitions and the master timeline
   ================================================================ */
function pixelWipe(t, t0, dur, drawA, drawB) {
  drawA();
  const n = 64, cols = Math.ceil(W / n), rows = Math.ceil(H / n), R = rng(5);
  ctx.save(); ctx.beginPath();
  let any = false;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const d = (c / cols) * .7 + (r / rows) * .3, tb = t0 + d * dur * .75 + R() * dur * .2;
    const q = E.outQuad(seg(t, tb, tb + dur * .25));
    if (q <= 0) continue;
    const s = n * q; any = true;
    ctx.rect(c * n + (n - s) / 2, r * n + (n - s) / 2, s + .5, s + .5);
  }
  if (any) { ctx.clip(); drawB(); }
  ctx.restore();
}
function render(t) {
  ctx = ctx0;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.imageSmoothingEnabled = true;
  if (t < T.drop) {
    scene1(t);
  } else if (t < T.whip) {
    scene2(t); ballBurst(t);
  } else if (t < T.battle + .02) {
    const pan = W * E.inOutQuart(seg(t, T.whip, T.battle));
    ctx.save(); ctx.translate(-pan, 0); scene2(t); ctx.restore();
    ctx.save(); ctx.translate(W - pan, 0); scene3(t); ctx.restore();
  } else if (t < T.dex) {
    scene3(t);
  } else if (t < T.vs) {
    sceneDex(t);
  } else if (t < T.vs + .22) {
    sceneDex(t); sceneVS(t);
  } else if (t < T.level - .2) {
    sceneVS(t);
  } else if (t < T.level + .15) {
    pixelWipe(t, T.level - .2, .35, () => sceneVS(t), () => sceneLevel(t));
  } else if (t < T.regions - .22) {
    sceneLevel(t);
  } else if (t < T.regions) {
    // the chosen card flips towards the camera and opens onto Kanto
    sceneLevel(t);
    const p = seg(t, T.regions - .22, T.regions), e = E.inCubic(p);
    const P = cardPos(2, t), s = lerp(1.14, 6, e), x = lerp(P.x, 960, e), y = lerp(P.y, 540, e);
    const flip = Math.cos(Math.PI * E.inOutQuad(seg(p, 0, .55))), k = Math.max(.02, Math.abs(flip));
    ctx.save(); ctx.translate(x, y); ctx.rotate(P.rot * (1 - e)); ctx.scale(s * k, s);
    if (flip > 0) cardFace(CARDS[2], CW, CH, t);
    else {
      rrect(-CW / 2, -CH / 2, CW, CH, 26 * (1 - e)); ctx.clip();
      ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
      sceneRegions(t);
    }
    ctx.restore();
  } else if (t < T.logo) {
    sceneRegions(t); ballClose(t);
  } else {
    sceneLogo(t);
  }
  hud(t);
  // loop seam: fade to the opening's navy in the last frames
  const fo = seg(t, DUR - .12, DUR);
  if (fo > 0) { ctx.fillStyle = rgba('#0B0F22', fo); ctx.fillRect(0, 0, W, H); }
}

/* ================================================================
   Frame rendering with real motion blur: average sub-frames over a
   leading 180° shutter, so cuts stay clean.
   ================================================================ */
let ACC = null;
function renderFrame(i, sub = 1, shutter = .5) {
  const t0 = i / FPS;
  if (sub <= 1) { render(t0); return; }
  const w = cv.width, h = cv.height;
  if (!ACC || ACC.length !== w * h * 4) ACC = new Uint16Array(w * h * 4); else ACC.fill(0);
  for (let s = 0; s < sub; s++) {
    render(Math.min(DUR - 1e-4, t0 + (s / sub) * shutter / FPS));
    const d = ctx0.getImageData(0, 0, w, h).data;
    for (let k = 0; k < d.length; k++) ACC[k] += d[k];
  }
  const out = ctx0.createImageData(w, h), o = out.data;
  for (let k = 0; k < o.length; k++) o[k] = (ACC[k] + (sub >> 1)) / sub;
  ctx0.putImageData(out, 0, 0);
}
// more samples where things move fastest, so blur stays smooth instead of stepping
const FAST = [[0, b(1), 16], [b(1.25), b(3.2), 16], [T.drop - .25, T.drop + .15, 24], [T.tap, T.tap + .35, 16],
  [T.whip, T.battle, 32], [T.dex, T.dex + .5, 24], [T.vs, T.vs + .3, 24], [T.level - .2, T.level + .15, 12],
  [T.regions - .22, T.regions + .05, 24], [T.hoenn - .14, T.hoenn + .14, 16], [T.logo - .26, T.logo + .45, 24]];
function subFor(i, base = 8) {
  const t = i / FPS;
  return FAST.reduce((n, [a, c, k]) => (t >= a - 1 / FPS && t <= c ? Math.max(n, k) : n), base);
}
window.renderFrame = renderFrame;
window.subFor = subFor;
window.renderAt = t => render(t);
window.META = { W, H, FPS, DUR, BPM: 128, T };

/* ================================================================
   Boot: in a browser, play on a loop; under render.mjs, wait to be driven
   ================================================================ */
preload().then(() => {
  window.READY = true;
  if (RENDER) return;
  const fixed = QS.get('t');
  if (fixed != null) { render(+fixed); return; }
  let start = performance.now(), paused = false, pt = 0;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; if (!paused) start = performance.now() - pt * 1000; }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { paused = true; pt = clamp(pt + (e.code === 'ArrowRight' ? 1 : -1) / FPS, 0, DUR - 1e-3); render(pt); }
  });
  cv.addEventListener('click', () => { paused = !paused; if (!paused) start = performance.now() - pt * 1000; });
  (function loop(now) {
    if (!paused) { pt = ((now - start) / 1000) % DUR; render(pt); }
    requestAnimationFrame(loop);
  })(performance.now());
}).catch(e => { window.LOAD_ERROR = String(e); console.error(e); });
</script>
</body>
