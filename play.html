<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym Tracker — try it</title>
<meta name="description" content="Try the Gym Tracker Pokémon game in a phone-sized window. Every visit starts a new game.">
<link rel="icon" href="icons/icon-192.png">
<!-- The README's "Try it live" page: the game in a phone-sized frame, starting a fresh
     demo save on every visit (index.html?demo keeps it apart from a real save). -->
<style>
  @font-face { font-family: 'Press Start 2P'; src: url('fonts/press-start-2p.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'VT323'; src: url('fonts/vt323.woff2') format('woff2'); font-display: swap; }
  :root { --bg: #eef2f6; --ink: #182028; --muted: #5a6572; --accent: #d03028; --bezel: #283038; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 20px/1.3 'VT323', ui-monospace, monospace;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }
  header { width: 100%; max-width: 900px; padding: 14px 16px 10px; display: flex; flex-wrap: wrap;
           align-items: center; justify-content: center; gap: 6px 18px; text-align: center; }
  h1 { font: 13px/1.4 'Press Start 2P', monospace; margin: 0; letter-spacing: 0.5px; }
  .hint { color: var(--muted); }
  .actions { display: flex; gap: 10px; }
  button, a.btn {
    font: 10px/1 'Press Start 2P', monospace; color: var(--ink); background: #fff; text-decoration: none;
    border: 2px solid var(--ink); border-radius: 6px; padding: 9px 12px; cursor: pointer;
  }
  button:hover, a.btn:hover { background: var(--ink); color: #fff; }
  #stage { flex: 1; width: 100%; position: relative; }
  #phone {
    position: absolute; left: 50%; top: 0;
    width: 414px; height: 868px; padding: 12px;
    background: var(--bezel); border-radius: 46px;
    box-shadow: 0 18px 50px rgba(24, 32, 40, 0.28);
    transform-origin: top center;
  }
  iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 34px; background: #182028; }
</style>
</head>
<body>
<header>
  <h1>GYM TRACKER · TRY IT</h1>
  <span class="hint">A new game on every visit. Log sets to fight!</span>
  <span class="actions">
    <button id="restart" type="button">RESTART</button>
    <a class="btn" href="https://github.com/mateuszkrw-coder/gym-tracker-pokemon-game">GITHUB</a>
  </span>
</header>
<div id="stage"><div id="phone"><iframe id="game" title="Gym Tracker" allow="autoplay"></iframe></div></div>
<script>
(function () {
  var DEMO_KEY = 'gymtracker.demo';
  function wipe() { try { localStorage.removeItem(DEMO_KEY); } catch (e) {} }

  wipe();
  // On a real phone the frame only gets in the way: open the demo full screen.
  if (Math.min(window.innerWidth, screen.width) < 600) { location.replace('./?demo'); return; }

  var phone = document.getElementById('phone'), stage = document.getElementById('stage');
  var game = document.getElementById('game');
  function fit() {
    var s = Math.min(1, (stage.clientHeight - 16) / 868, (stage.clientWidth - 16) / 414);
    phone.style.transform = 'translateX(-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  game.src = './?demo';

  // Unload the running game first so nothing it still holds can be saved over the wipe.
  document.getElementById('restart').addEventListener('click', function () {
    game.src = 'about:blank';
    setTimeout(function () { wipe(); game.src = './?demo&r=' + Date.now(); }, 150);
  });
})();
</script>
</body>
</html>
